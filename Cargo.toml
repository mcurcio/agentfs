[workspace]
resolver = "3"
exclude = ["vendor/fuser"]
members = ["crates/agentfs-align", "crates/agentfs-lines", "crates/agentfs-failpoints", "crates/agentfs-os", "crates/agentfs-git", "crates/agentfs-rules", "crates/agentfs-contracts", "crates/agentfs-volume", "crates/agentfs-clients", "crates/agentfs-trees", "crates/agentfs-core", "crates/agentfs-fuse", "crates/agentfs", "crates/agentfs-csi", "crates/agentfs-model", "crates/agentfs-conformance", "crates/agentfs-repo"]

[workspace.package]
edition = "2024"
# File::lock and its family (agentfs_core::file_lock).
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mcurcio/agentfs"

# The layers of the workspace's packages, lowest first. Each package names its
# own in `[package.metadata.agentfs] layer`; a normal or build dependency
# points to a package of the same layer or a lower one, and a dev-dependency
# may point anywhere (docs/architecture.md, "Layers"; crates/agentfs-repo
# checks it).
[workspace.metadata.agentfs]
layers = ["leaf", "kernel", "domain", "engine", "filesystem", "kubernetes", "tests"]

[patch.crates-io]
fuser = { path = "vendor/fuser" }

# Development and test builds keep line tables, so a panic's backtrace still
# names file and line, and drop the rest of the debug info: smaller objects,
# faster links, a smaller target directory. Dependencies carry none. Release
# builds are unchanged (docs/development.md, "Build settings").
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
