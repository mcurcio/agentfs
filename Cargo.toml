[workspace]
resolver = "3"
exclude = ["vendor/fuser"]
members = ["crates/agentfs-core", "crates/agentfs-fuse", "crates/agentfs", "crates/agentfs-csi", "crates/agentfs-model"]

[workspace.package]
edition = "2024"
# File::lock and its family (agentfs_core::file_lock).
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mcurcio/agentfs"

[patch.crates-io]
fuser = { path = "vendor/fuser" }
