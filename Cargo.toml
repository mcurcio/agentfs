[workspace]
resolver = "3"
exclude = ["vendor/fuser"]
members = ["crates/agentfs-align", "crates/agentfs-lines", "crates/agentfs-failpoints", "crates/agentfs-os", "crates/agentfs-git", "crates/agentfs-rules", "crates/agentfs-contracts", "crates/agentfs-volume", "crates/agentfs-clients", "crates/agentfs-trees", "crates/agentfs-engine", "crates/agentfs-core", "crates/agentfs-service", "crates/agentfs", "crates/agentfs-fuse", "crates/agentfs-cli", "crates/agentfs-csi", "crates/agentfs-model", "crates/agentfs-conformance", "crates/agentfs-test-metrics", "crates/agentfs-repo"]

[workspace.package]
# The product's one version, which every published package takes: it is
# written into what agentfs records and reports (history's verification
# notes, the LFS user agent, the telemetry scope, the CSI vendor version).
version = "0.1.0"
edition = "2024"
# File::lock and its family (agentfs_os::file_lock).
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mcurcio/agentfs"

# The ranks of the workspace's packages, each listed after every rank it
# uses; each package names its own in `[package.metadata.agentfs] rank`.
# What a rank permits: docs/architecture.md, "Ranks" (crates/agentfs-repo
# checks it).
[workspace.metadata.agentfs]
ranks = [
    { name = "line-identity", uses = ["line-identity"] },
    { name = "leaf", uses = ["line-identity", "leaf"] },
    { name = "shared-kernel", uses = [] },
    { name = "domain", uses = ["shared-kernel"] },
    { name = "engine", uses = ["line-identity", "leaf", "shared-kernel", "domain"] },
    { name = "service", uses = ["shared-kernel", "domain", "engine"] },
    { name = "filesystem", uses = ["leaf", "shared-kernel", "domain", "engine", "service", "filesystem"] },
    { name = "kubernetes", uses = ["leaf", "shared-kernel", "engine", "filesystem"] },
    { name = "umbrella", uses = ["shared-kernel", "domain", "engine", "service"] },
    { name = "tests", uses = ["line-identity", "leaf", "shared-kernel", "domain", "engine", "service", "filesystem", "kubernetes", "tests"] },
]

[patch.crates-io]
fuser = { path = "vendor/fuser" }

# Development and test builds keep line tables, so a panic's backtrace still
# names file and line, and drop the rest of the debug info: smaller objects,
# faster links, a smaller target directory. Dependencies carry none. Release
# builds are unchanged (docs/development.md, "Build settings").
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
