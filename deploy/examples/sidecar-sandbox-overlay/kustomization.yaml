# deploy/sidecar with the sandbox overlay (docs/deployment.md §12): the
# component deploy/sidecar/sandbox-overlay applied to the sidecar base.
# It lives outside deploy/sidecar because kustomize refuses a base that
# contains the kustomization using it.
#
#   kubectl apply -k deploy/examples/sidecar-sandbox-overlay
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../sidecar

components:
  - ../../sidecar/sandbox-overlay
