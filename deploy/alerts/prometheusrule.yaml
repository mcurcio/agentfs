# GENERATED by ci/alerts-prometheusrule.sh from deploy/alerts/agentfs.rules.yml:
# edit that file, then regenerate this one. Explained in docs/deployment.md
# ("Alerts"). Your Prometheus Operator's ruleSelector may need a label
# added here (kube-prometheus-stack's default selects `release: <its release>`).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: agentfs
  labels:
    app.kubernetes.io/name: agentfs
spec:
  groups:
    - name: agentfs-recording
      rules:
        - alert: AgentfsRecordFailed
          expr: |
            increase(agentfs_record_failures_total[10m]) > 0
              or (agentfs_record_failures_total > 0 unless agentfs_record_failures_total offset 10m)
          labels:
            severity: critical
          annotations:
            summary: "agentfs could not record a change ({{ $labels.instance }})"
            description: >-
              The synchronous step failed (trigger {{ $labels.trigger }}): the
              workload's call got EIO or its own error, and the change is not in
              history until it is recorded again. Usually the state area is full
              or unwritable. Read the RecordFailed alarm in the agentfs log.
            runbook_url: https://github.com/mcurcio/agentfs/blob/main/docs/runbooks/recording-failures.md
        - alert: AgentfsCommitsFailing
          expr: |
            (
              increase(agentfs_commit_failures_total[5m]) > 0
                or (agentfs_commit_failures_total > 0 unless agentfs_commit_failures_total offset 5m)
            )
            and on (job, instance, agentfs_volume) agentfs_journal_backlog > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "agentfs commits keep failing with records waiting ({{ $labels.instance }})"
            description: >-
              Commit passes have failed for 10 minutes while the journal holds
              records. The records are safe in the journal and are retried, but
              history does not advance and the state area grows.
            runbook_url: https://github.com/mcurcio/agentfs/blob/main/docs/runbooks/recording-failures.md#3-commits-failing-commitfailed
        - alert: AgentfsRepackFailed
          expr: |
            increase(agentfs_repack_failures_total[3h]) > 0
              or (agentfs_repack_failures_total > 0 unless agentfs_repack_failures_total offset 3h)
          labels:
            severity: warning
          annotations:
            summary: "agentfs could not repack its history ({{ $labels.instance }})"
            description: >-
              The periodic git repack failed. History is intact, only less
              compact; it is tried again one agentfs.repackInterval later.
              Read the RepackFailed alarm in the agentfs log.
            runbook_url: https://github.com/mcurcio/agentfs/blob/main/docs/runbooks/recording-failures.md#1-the-state-area-is-full-or-unwritable
        - alert: AgentfsReconcileFailed
          expr: |
            increase(agentfs_reconcile_failures_total[1h]) > 0
              or (agentfs_reconcile_failures_total > 0 unless agentfs_reconcile_failures_total offset 1h)
          labels:
            severity: warning
          annotations:
            summary: "agentfs gave up reconciling a moved directory ({{ $labels.instance }})"
            description: >-
              History may differ from the tree beneath a moved directory until
              each affected file changes again. Read the ReconcileFailed alarm
              in the agentfs log.
            runbook_url: https://github.com/mcurcio/agentfs/blob/main/docs/runbooks/reconcile-failed.md
        - alert: AgentfsHistoryServiceUnreachable
          expr: |
            increase(agentfs_front_service_failures_total[5m]) > 0
              or (agentfs_front_service_failures_total > 0 unless agentfs_front_service_failures_total offset 5m)
          labels:
            severity: critical
          annotations:
            summary: "an agentfs front could not reach its history service ({{ $labels.instance }})"
            description: >-
              A front's requests failed (stage {{ $labels.stage }}): the
              workload's boundaries fail with EIO until the history service
              answers again.
            runbook_url: https://github.com/mcurcio/agentfs/blob/main/docs/runbooks/history-service-down.md
    - name: agentfs-remotes
      rules:
        - alert: AgentfsPushBacklogOld
          expr: agentfs_push_oldest_unpushed_age_seconds > 3600
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "agentfs history has not reached remote {{ $labels.remote }} for over an hour ({{ $labels.instance }})"
            description: >-
              The oldest commit remote {{ $labels.remote }} lacks is
              {{ $value | humanizeDuration }} old. Read the PushFailed alarms
              in the agentfs log, or agentfs status in the sidecar.
            runbook_url: https://github.com/mcurcio/agentfs/blob/main/docs/runbooks/stuck-pushes.md
        - alert: AgentfsPushBacklogStale
          expr: agentfs_push_oldest_unpushed_age_seconds > 6 * 3600
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "agentfs history has not reached remote {{ $labels.remote }} for over 6 hours ({{ $labels.instance }})"
            description: >-
              The oldest commit remote {{ $labels.remote }} lacks is
              {{ $value | humanizeDuration }} old. Until it is pushed, that
              history exists only in the state area.
            runbook_url: https://github.com/mcurcio/agentfs/blob/main/docs/runbooks/stuck-pushes.md
        - alert: AgentfsPushDiverged
          expr: agentfs_push_diverged > 0
          labels:
            severity: critical
          annotations:
            summary: "remote {{ $labels.remote }} has diverged from the agentfs volume ({{ $labels.instance }})"
            description: >-
              Another writer moved the volume's branch on remote
              {{ $labels.remote }}. agentfs saved its own head under a diverged
              ref and stopped pushing there; nothing was overwritten.
            runbook_url: https://github.com/mcurcio/agentfs/blob/main/docs/runbooks/divergence.md
        - alert: AgentfsRemoteMisconfigured
          expr: agentfs_remote_misconfigured > 0
          labels:
            severity: warning
          annotations:
            summary: "agentfs remote {{ $labels.remote }} is misconfigured and never pushed ({{ $labels.instance }})"
            description: >-
              The [remote "{{ $labels.remote }}"] section is invalid, so it is
              left out. The RemoteMisconfigured alarm names the key.
            runbook_url: https://github.com/mcurcio/agentfs/blob/main/docs/runbooks/stuck-pushes.md#diagnose-by-kind
        - alert: AgentfsPatchQueueBlocked
          expr: agentfs_patch_blocked > 0
          labels:
            severity: warning
          annotations:
            summary: "the agentfs patch queue is blocked ({{ $labels.instance }})"
            description: >-
              A patch could not be applied at mount, so it and the patches after
              it wait for their producer. The volume mounted anyway.
            runbook_url: https://github.com/mcurcio/agentfs/blob/main/docs/runbooks/patch-queue.md#4-a-blocked-queue
    - name: agentfs-operations
      rules:
        - alert: AgentfsWorktreeHeuristic
          expr: |
            increase(agentfs_nested_gitdir_heuristic_total[1h]) > 0
              or (agentfs_nested_gitdir_heuristic_total > 0 unless agentfs_nested_gitdir_heuristic_total offset 1h)
          labels:
            severity: info
          annotations:
            summary: "agentfs matched a worktree's gitdir by its suffix ({{ $labels.instance }})"
            description: >-
              An absolute gitdir or .git symlink target was found by trying its
              suffixes. Set --workload-mount (CSI: workloadMounts) to map it
              exactly.
            runbook_url: https://github.com/mcurcio/agentfs/blob/main/docs/runbooks/worktree-heuristic.md
        - alert: AgentfsTelemetryExportFailing
          expr: |
            increase(agentfs_telemetry_export_failures_total[15m]) > 0
              or (agentfs_telemetry_export_failures_total > 0 unless agentfs_telemetry_export_failures_total offset 15m)
          labels:
            severity: warning
          annotations:
            summary: "agentfs could not export {{ $labels.signal }} ({{ $labels.instance }})"
            description: >-
              Exports of {{ $labels.signal }} to the collector failed; alarm
              logs or spans may be missing. Telemetry never stops agentfs.
            runbook_url: https://github.com/mcurcio/agentfs/blob/main/docs/operator-guide.md#15-troubleshooting
