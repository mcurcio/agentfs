# The controller: csi-provisioner and csi-attacher in front of
# `agentfs-csi --mode controller` (design §14.2, docs/csi.md
# "Architecture"). CreateVolume makes <basePath>/<pv>/{backing,state,
# csi.json} and initialises the state area; ControllerPublish only tracks
# the node, so Kubernetes keeps each volume on one node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentfs-csi-controller
  namespace: agentfs-csi
  labels:
    app.kubernetes.io/name: agentfs-csi-controller
spec:
  # The sidecars elect a leader: a second replica is a hot standby.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentfs-csi-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentfs-csi-controller
    spec:
      serviceAccountName: agentfs-csi-controller
      # Only the two sidecars talk to the API server: the token is mounted
      # into them alone (the `api-token` volume), never into agentfs-csi.
      automountServiceAccountToken: false
      priorityClassName: system-cluster-critical
      containers:
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner
          args:
            - --csi-address=/csi/csi.sock
            # PVC name and namespace for the volume name and branch.
            - --extra-create-metadata
            - --leader-election
            - --leader-election-namespace=agentfs-csi
            - --timeout=60s
          securityContext:
            # Root (with no capabilities) to reach agentfs-csi's socket,
            # which is root's and mode 0660.
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: socket-dir, mountPath: /csi }
            - { name: api-token, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true }
        - name: csi-attacher
          image: registry.k8s.io/sig-storage/csi-attacher
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election
            - --leader-election-namespace=agentfs-csi
            - --timeout=60s
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: socket-dir, mountPath: /csi }
            - { name: api-token, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true }
        - name: liveness-probe
          image: registry.k8s.io/sig-storage/livenessprobe
          args: [--csi-address=/csi/csi.sock, --http-endpoint=:9808]
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: socket-dir, mountPath: /csi }
        - name: agentfs-csi
          image: ghcr.io/mcurcio/agentfs
          command: [agentfs-csi]
          args:
            - --mode=controller
            - --endpoint=unix:///csi/csi.sock
            - --base-path=/var/lib/agentfs-csi/volumes
            - --profiles-dir=/etc/agentfs-csi/profiles
          ports:
            - { name: healthz, containerPort: 9808 }
          livenessProbe:
            httpGet: { path: /healthz, port: healthz }
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          # Root, because the volume directories on the host are root's;
          # DAC_OVERRIDE and FOWNER only so that DeleteVolume (onDelete:
          # delete) can remove files the workloads' uids created.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [DAC_OVERRIDE, FOWNER]
            readOnlyRootFilesystem: true
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: socket-dir, mountPath: /csi }
            - { name: base, mountPath: /var/lib/agentfs-csi/volumes }
            - { name: profiles, mountPath: /etc/agentfs-csi/profiles, readOnly: true }
      volumes:
        - name: socket-dir
          emptyDir: {}
        # basePath: one filesystem the controller and every node see at the
        # same path (docs/csi.md "Requirements"). A hostPath is right for a
        # single node; on several nodes, mount a shared filesystem here.
        - name: base
          hostPath: { path: /var/lib/agentfs-csi/volumes, type: DirectoryOrCreate }
        - name: profiles
          configMap: { name: agentfs-csi-profiles }
        - name: api-token
          projected:
            sources:
              - serviceAccountToken: { path: token, expirationSeconds: 3600 }
              - configMap:
                  name: kube-root-ca.crt
                  items: [{ key: ca.crt, path: ca.crt }]
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef: { fieldPath: metadata.namespace }
