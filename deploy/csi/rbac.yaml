# The driver's whole RBAC inventory (design §14.2, docs/csi.md
# "Security"). No rule grants secrets, pods or snapshots: credentials are
# a Secret mounted into the driver's own pods, never read through the API.
#
# The node plugin's account is used by one container only, csi-provisioner
# (`--node-deployment`), which provisions and deletes the worktrees of its
# own node: the DaemonSet does not mount the token, and projects it into
# that sidecar alone, never into agentfs-csi.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentfs-csi-node
  namespace: agentfs-csi
automountServiceAccountToken: false
---
# csi-provisioner: turns PVCs of agentfs StorageClasses into PVs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentfs-csi-provisioner
rules:
  # Creates the PV for a claim, and deletes it after DeleteVolume.
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, watch, create, patch, delete]
  # Watches claims to provision, and marks them (annotations, finalizer).
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, update]
  # Reads the StorageClass parameters (the profile) of a claim.
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  # Reports provisioning progress and failures on the claim.
  - apiGroups: [""]
    resources: [events]
    verbs: [list, watch, create, update, patch]
  # WaitForFirstConsumer and node-deployment: the selected node's topology.
  - apiGroups: [storage.k8s.io]
    resources: [csinodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentfs-csi-provisioner
subjects:
  - kind: ServiceAccount
    name: agentfs-csi-node
    namespace: agentfs-csi
roleRef:
  kind: ClusterRole
  name: agentfs-csi-provisioner
  apiGroup: rbac.authorization.k8s.io
