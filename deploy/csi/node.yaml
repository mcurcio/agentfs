# The node plugin: `agentfs-csi` under tini on every node, with
# csi-provisioner (`--node-deployment`), node-driver-registrar and
# livenessprobe (design §14.2, docs/csi.md "Architecture"). Each node
# provisions the worktrees on its own disk: CreateVolume makes one under
# the base path, NodeStage starts one `agentfs serve-history` per volume,
# NodePublish one `agentfs mount --history-service` front per pod,
# bind-mounted onto the kubelet's target, and the release scan pushes the
# worktrees no pod stages.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agentfs-csi-node
  namespace: agentfs-csi
  labels:
    app.kubernetes.io/name: agentfs-csi-node
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: agentfs-csi-node
  # Restarting the plugin stops the fronts it runs: the mounts on that node
  # answer ENOTCONN until the new plugin recovers them. Roll it by hand,
  # one drained node at a time (docs/runbooks/csi-recovery.md).
  updateStrategy:
    type: OnDelete
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentfs-csi-node
    spec:
      serviceAccountName: agentfs-csi-node
      # Only csi-provisioner talks to the API server: the token is mounted
      # into it alone (the `api-token` volume), never into agentfs-csi.
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      # Longer than --unpublish-grace (20s) + --unstage-grace (30s): a
      # stopped plugin lets its children make their final commits.
      terminationGracePeriodSeconds: 60
      # The workloads' processes must be visible to the fronts: FUSE reports
      # a caller outside the plugin's pid namespace as pid 0, whose
      # supplementary groups (a pod's fsGroup) are then unknown, and new
      # files are created as root before being given to the pod (design §6,
      # docs/csi.md "Pod Security").
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: agentfs-csi
          image: ghcr.io/mcurcio/agentfs
          # tini reaps whatever the children leave behind (design §14.2); with
          # hostPID it is not PID 1, so it registers as a subreaper (-s).
          command: [tini, -s, --, agentfs-csi]
          args:
            - --endpoint=unix:///csi/csi.sock
            - --base-path=/var/lib/agentfs-csi/volumes
            - --node-state=/var/lib/agentfs-csi/node
            - --mount-dir=/run/agentfs-csi/mounts
            - --profiles-dir=/etc/agentfs-csi/profiles
          env:
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: AGENTFS_CSI_POD
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: AGENTFS_CSI_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            # OpenTelemetry (docs/telemetry.md), inherited by every
            # service and front: point it at your collector.
            - { name: OTEL_SDK_DISABLED, value: "true" }
          ports:
            - { name: healthz, containerPort: 9808 }
          livenessProbe:
            httpGet: { path: /healthz, port: healthz }
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          # FUSE mounts and Bidirectional propagation into the kubelet's
          # directory need privileged (design §14.2 "Pod Security").
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - { name: plugin-dir, mountPath: /csi }
            # The kubelet's targets: the binds made here must reach the
            # host, and the workloads' containers.
            - { name: kubelet-dir, mountPath: /var/lib/kubelet, mountPropagation: Bidirectional }
            # This node's worktrees, on its own disk.
            - { name: base, mountPath: /var/lib/agentfs-csi/volumes, mountPropagation: HostToContainer }
            # Staged and published records: what a restarted plugin
            # reconciles from.
            - { name: node-state, mountPath: /var/lib/agentfs-csi/node }
            # The fronts' FUSE mounts (sources of the binds).
            - { name: mounts, mountPath: /run/agentfs-csi }
            - { name: profiles, mountPath: /etc/agentfs-csi/profiles, readOnly: true }
            - { name: credentials, mountPath: /etc/agentfs-csi/credentials, readOnly: true }
            - { name: dev-fuse, mountPath: /dev/fuse }
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner
          args:
            - --csi-address=/csi/csi.sock
            # PVC name and namespace for the volume name.
            - --extra-create-metadata
            # One provisioner per node: it creates and deletes only the
            # worktrees of its own node (NODE_NAME).
            - --node-deployment
            # A start class's CreateVolume fetches the start branch once.
            - --timeout=300s
          env:
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          securityContext:
            # Root (with no capabilities) to reach agentfs-csi's socket,
            # which is root's and mode 0660.
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: plugin-dir, mountPath: /csi }
            - { name: api-token, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true }
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/agentfs.mcurcio.github.io/csi.sock
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: plugin-dir, mountPath: /csi }
            - { name: registration-dir, mountPath: /registration }
        - name: liveness-probe
          image: registry.k8s.io/sig-storage/livenessprobe
          args: [--csi-address=/csi/csi.sock, --http-endpoint=:9808]
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: plugin-dir, mountPath: /csi }
      volumes:
        - name: plugin-dir
          hostPath: { path: /var/lib/kubelet/plugins/agentfs.mcurcio.github.io, type: DirectoryOrCreate }
        - name: registration-dir
          hostPath: { path: /var/lib/kubelet/plugins_registry, type: Directory }
        - name: kubelet-dir
          hostPath: { path: /var/lib/kubelet, type: Directory }
        - name: base
          hostPath: { path: /var/lib/agentfs-csi/volumes, type: DirectoryOrCreate }
        - name: node-state
          hostPath: { path: /var/lib/agentfs-csi/node, type: DirectoryOrCreate }
        - name: mounts
          emptyDir: {}
        - name: dev-fuse
          hostPath: { path: /dev/fuse, type: CharDevice }
        - name: profiles
          configMap: { name: agentfs-csi-profiles }
        - name: credentials
          secret: { secretName: agentfs-csi-credentials, defaultMode: 0400 }
        # The token of csi-provisioner (never mounted into agentfs-csi).
        - name: api-token
          projected:
            sources:
              - serviceAccountToken: { path: token, expirationSeconds: 3600 }
              - configMap:
                  name: kube-root-ca.crt
                  items: [{ key: ca.crt, path: ca.crt }]
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef: { fieldPath: metadata.namespace }
