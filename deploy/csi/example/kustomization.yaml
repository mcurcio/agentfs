# A workload on the agentfs CSI driver (docs/csi.md "Using a volume"):
# a StorageClass, a claim and two replicas sharing it, each committing
# under its own identity. Install the driver first (deploy/csi).
#
#   kubectl apply -k deploy/csi/example
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - storageclass.yaml
  - pvc.yaml
  - deployment.yaml
