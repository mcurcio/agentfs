# A workload on the agentfs CSI driver (docs/csi.md "Using a volume"):
# a StorageClass, a claim and the one pod using it, and a fork class for
# fork claims (docs/csi.md). Install the driver first (deploy/csi).
#
#   kubectl apply -k deploy/csi/example
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - storageclass.yaml
  - fork-storageclass.yaml
  - pvc.yaml
  - deployment.yaml
