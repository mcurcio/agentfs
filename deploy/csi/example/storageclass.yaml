# Every setting of a volume is the operator's: the StorageClass names a
# profile from the agentfs-csi-profiles ConfigMap (docs/csi.md
# "Parameters"). Pod authors only choose the class.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: agentfs
provisioner: agentfs.mcurcio.github.io
parameters:
  profile: example
  # The agentfs volume name; the history branch is agentfs/<volumeName>.
  # Keep {pvName} in it: a claim deleted and created again must get a new
  # branch, not a fresh root commit on the old one (docs/csi.md §5).
  volumeName: "{pvcNamespace}.{pvcName}.{pvName}"
  # DeleteVolume keeps the files and history (reusable through a static
  # PV); `delete` removes them once every remote has the history.
  onDelete: retain
reclaimPolicy: Retain
# Provisioned once a pod is scheduled, on that pod's node.
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false
