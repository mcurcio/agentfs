# Every setting of a volume is the operator's: the StorageClass names a
# profile from the agentfs-csi-profiles ConfigMap (docs/csi.md
# "Parameters"). Pod authors only choose the class.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: agentfs
provisioner: agentfs.mcurcio.github.io
parameters:
  profile: example
  # The agentfs volume name, the source of each view's mount
  # (`agentfs:<volumeName>`) and the volume in every commit's trailers.
  # It must contain {pvName}: each claim is a volume of its own.
  volumeName: "{pvcNamespace}.{pvcName}.{pvName}"
  # DeleteVolume keeps the volume's directory on its node, its history
  # with it, once no pod uses it. `retain` is the only choice built.
  onDelete: retain
# Always Delete (the admission policy in deploy/csi refuses any other):
# DeleteVolume runs, and onDelete: retain keeps the volume's directory.
reclaimPolicy: Delete
# Provisioned once a pod is scheduled, on that pod's node, which then
# holds the volume on its own disk.
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false
