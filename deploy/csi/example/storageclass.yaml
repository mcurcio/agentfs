# Every setting of a volume is the operator's: the StorageClass names a
# profile from the agentfs-csi-profiles ConfigMap (docs/csi.md
# "Parameters"). Pod authors only choose the class.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: agentfs
provisioner: agentfs.mcurcio.github.io
parameters:
  profile: example
  # The agentfs volume name; the history branch is agentfs/<volumeName>.
  # It must contain {pvName}: each claim is a worktree with its own branch,
  # for good (docs/csi.md §5).
  volumeName: "{pvcNamespace}.{pvcName}.{pvName}"
  # DeleteVolume keeps the worktree on its node once every remote holds
  # its head (reusable through a static PV there); `delete` removes it then.
  onDelete: retain
# Always Delete (the admission policy in deploy/csi refuses any other):
# DeleteVolume decides, and onDelete: retain keeps the worktree.
reclaimPolicy: Delete
# Provisioned once a pod is scheduled, on that pod's node, which then
# holds the worktree on its own disk.
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false
