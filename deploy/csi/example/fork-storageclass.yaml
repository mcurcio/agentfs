# A fork class (docs/csi.md): a claim on it whose dataSource is a claim of
# the `agentfs` class is a fork claim, a fork of that volume in the same
# volume, owned by its source's host under the claim's handle. Its changes
# land in the source automatically. It is made on the source's node: give
# the fork claim's pod affinity to its source's pod. Deleting the fork
# claim ends its fork. A fork class takes only `fork` and `landing`
# (`automatic`, the default); `link: unlinked` and `landing: approval` are
# refused as not built.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: agentfs-fork
provisioner: agentfs.mcurcio.github.io
parameters:
  fork: "true"
# Only Delete (the admission policy in deploy/csi refuses anything else).
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false
