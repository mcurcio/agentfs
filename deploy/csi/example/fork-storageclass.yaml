# A fork class (design §11.5, docs/csi.md §14): a claim on it whose
# dataSource is a claim of the `agentfs` class is a fork of that volume,
# with its profile. A pod-scoped ephemeral claim finishes the fork when the
# pod goes; the driver deletes the volume once the fork is published to its
# fork remote.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: agentfs-fork
provisioner: agentfs.mcurcio.github.io
parameters:
  fork: "true"
  # Keep {pvName}: each fork must be unique on the remote.
  volumeName: "{pvcNamespace}.{pvcName}.{pvName}"
  onDelete: delete
# Only Delete (the admission policy in deploy/csi refuses anything else).
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false
