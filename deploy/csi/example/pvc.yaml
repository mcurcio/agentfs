# One pod per volume: ReadWriteOncePod lets the scheduler itself keep a
# second pod off the claim (the driver refuses a second pod's publish
# either way). Every multi-node mode (ReadWriteMany, ReadOnlyMany) is
# refused. The size is not enforced.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace
  namespace: agentfs-example
spec:
  storageClassName: agentfs
  accessModes: [ReadWriteOncePod]
  resources:
    requests:
      storage: 1Gi
