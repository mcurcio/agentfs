# Two replicas on one agentfs volume. Each pod gets its own front (and
# committer identity, from podInfoOnMount); the node plugin runs one history
# service for both. ReadWriteOnce keeps them on one node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agents
  namespace: agentfs-example
  labels:
    app.kubernetes.io/name: agents
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agents
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agents
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        # The kubelet gives the volume this group once (the root's group
        # and setgid bit), not at every start.
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: agent
          image: busybox:1.37
          command: [sh, -c, 'while true; do date >> /workspace/heartbeat.txt; sleep 60; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          volumeMounts:
            # HostToContainer: when the node plugin replaces a crashed front,
            # the new mount reaches this container without a restart
            # (docs/csi.md "Recovery").
            - name: workspace
              mountPath: /workspace
              mountPropagation: HostToContainer
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: workspace
