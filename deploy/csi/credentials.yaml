# Remote credentials for every profile, mounted read-only into the driver's
# pods at /etc/agentfs-csi/credentials (docs/csi.md "Profiles and
# credentials"). A profile points at a key: `agentfsCredentials =
# /etc/agentfs-csi/credentials/<key>`. Kubelet refreshes the files when the
# Secret changes, and agentfs reads them at each push: rotation needs no
# restart. Replace the placeholder (or create the Secret out of band and
# drop this file from the kustomization).
apiVersion: v1
kind: Secret
metadata:
  name: agentfs-csi-credentials
  namespace: agentfs-csi
type: Opaque
stringData:
  # `username:token` for an https remote (docs/configuration.md).
  example-origin: "agentfs:replace-me"
