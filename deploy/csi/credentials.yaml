# Remote credentials for every profile, mounted read-only into the node
# plugin at /etc/agentfs-csi/credentials (docs/csi.md "Profiles and
# credentials"). A profile points at a key: `agentfsCredentials =
# /etc/agentfs-csi/credentials/<key>`. The kubelet refreshes the files when
# the Secret changes and agentfs re-reads them: rotation needs no restart.
#
# Create the real Secret out of band rather than committing it:
#
#   kubectl -n agentfs-csi create secret generic agentfs-csi-credentials \
#     --from-literal=example-origin=$'username=agentfs\npassword=<token>'
#
# SSH keys and known_hosts go here too (agentfsSshKey, agentfsKnownHosts;
# docs/configuration.md).
apiVersion: v1
kind: Secret
metadata:
  name: agentfs-csi-credentials
  namespace: agentfs-csi
type: Opaque
stringData:
  example-origin: |
    username=agentfs
    password=REPLACE_ME
