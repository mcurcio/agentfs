# Fork classes must have reclaim policy Delete (design §11.5, §19.1 "Fork
# finish"; docs/csi.md §14): a fork finishes when its claim is deleted,
# and only DeleteVolume tells the driver so. With Retain, a fork would
# never finish or publish.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: agentfs-fork-class
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["storage.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["storageclasses"]
  matchConditions:
    - name: an-agentfs-fork-class
      expression: >-
        object.provisioner == 'agentfs.mcurcio.github.io' &&
        has(object.parameters) && 'fork' in object.parameters &&
        object.parameters['fork'] == 'true'
  validations:
    - expression: "!has(object.reclaimPolicy) || object.reclaimPolicy == 'Delete'"
      message: >-
        an agentfs fork class (fork: "true") must have reclaimPolicy Delete:
        a fork finishes and publishes when its claim is deleted, which only
        DeleteVolume tells the driver (design §19.1 "Fork finish")
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: agentfs-fork-class
spec:
  policyName: agentfs-fork-class
  validationActions: [Deny]
