# The driver's namespace: the only place agentfs runs privileged (design
# §14.2, docs/csi.md "Security"). The node plugin needs privileged (FUSE,
# Bidirectional mount propagation into the kubelet's directory); nothing
# else may run here, so warn on anything beyond baseline.
apiVersion: v1
kind: Namespace
metadata:
  name: agentfs-csi
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
