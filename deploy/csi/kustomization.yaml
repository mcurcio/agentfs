# The agentfs CSI driver (design §14.2, docs/csi.md).
#
#   kubectl apply -k deploy/csi     # after editing profiles/ and credentials.yaml
#
# Installs only the driver, in the agentfs-csi namespace; a workload using
# it is in deploy/csi/example.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - csidriver.yaml
  - rbac.yaml
  - credentials.yaml
  - controller.yaml
  - node.yaml

# One profile per `<name>.config` (with optional `.exclude` and
# `.attributes`); a StorageClass picks one with `profile: <name>`. No hash
# suffix: the pods see edits through the mounted ConfigMap without being
# restarted (a state area includes its profile's config at each read, and
# NodeStage reinstalls the rules).
configMapGenerator:
  - name: agentfs-csi-profiles
    namespace: agentfs-csi
    options:
      disableNameSuffixHash: true
    files:
      - profiles/example.config
      - profiles/example.exclude
      - profiles/example.attributes

images:
  # Pin a commit tag (ghcr.io/mcurcio/agentfs:<40-char sha>) or a digest in
  # production; `latest` follows main.
  - name: ghcr.io/mcurcio/agentfs
    newTag: latest
  # The CSI sidecars, pinned by digest (the tag is informational).
  - name: registry.k8s.io/sig-storage/csi-provisioner
    newTag: v6.4.0
    digest: sha256:6ebe60fd8ed67a7f8a90d34402e9e706b274e53612d6fa5fbb8285728db622e2
  - name: registry.k8s.io/sig-storage/csi-attacher
    newTag: v4.13.0
    digest: sha256:d1a26170efed45491074ca4545c81844eee2b9043fb885ac01fb4aed6f8b72d2
  - name: registry.k8s.io/sig-storage/csi-node-driver-registrar
    newTag: v2.18.0
    digest: sha256:b7fefd08651f00ac4df1a196ed4c621c2451fbb899297fe9fad9e36c667af0c0
  - name: registry.k8s.io/sig-storage/livenessprobe
    newTag: v2.20.0
    digest: sha256:19f2cf2f40e1987c7943945deca5f65cd4e4bf5cc0657fc78a5df131861578e8
