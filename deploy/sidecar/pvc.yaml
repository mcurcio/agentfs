# The volume: its state area (state/: the files, the journal and
# history.git), mounted at /data in the agentfs containers only.
#
# ReadWriteOncePod makes this pod the volume's single writer;
# most clusters need a CSI driver for it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentfs-data
  labels:
    app.kubernetes.io/name: agentfs-example
spec:
  accessModes: [ReadWriteOncePod]
  resources:
    requests:
      storage: 10Gi
  # storageClassName: xfs-csi    # the cluster default otherwise
