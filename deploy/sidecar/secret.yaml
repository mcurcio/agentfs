# Push credentials for remote "origin", read from
# /run/secrets/agentfs/origin (agentfsCredentials in config/config). The
# file is re-read when the Secret changes: rotation needs no restart.
#
# Create the real Secret out of band rather than committing it:
#
#   kubectl create secret generic agentfs-credentials \
#     --from-literal=origin=$'username=agentfs\npassword=<token>'
#
# For an SSH remote, keep the private key and known_hosts here instead
# (keys ssh-privatekey and known_hosts; see docs/configuration.md).
# A separate Git LFS server takes its own key (origin-lfs, same format;
# remote.origin.agentfsLfsCredentials in config/config).
apiVersion: v1
kind: Secret
metadata:
  name: agentfs-credentials
  labels:
    app.kubernetes.io/name: agentfs-example
type: Opaque
stringData:
  origin: |
    username=agentfs
    password=REPLACE_ME
