# The git server (Dockerfile): /git/<repo>.git through git http-backend,
# with basic auth from /run/git-server/htpasswd. Everything nginx writes
# is under /run/git-server, so the root filesystem can be read-only; the
# entrypoint adds `user www-data;` when it starts as root.
worker_processes 1;
pid /run/git-server/nginx.pid;
error_log /dev/stderr;
events { worker_connections 64; }
http {
  access_log /dev/stdout;
  client_max_body_size 0;
  client_body_temp_path /run/git-server/body;
  fastcgi_temp_path /run/git-server/fastcgi;
  proxy_temp_path /run/git-server/proxy;
  scgi_temp_path /run/git-server/scgi;
  uwsgi_temp_path /run/git-server/uwsgi;
  server {
    listen 8080;
    location ~ ^/git(/.*)$ {
      auth_basic "git";
      auth_basic_user_file /run/git-server/htpasswd;
      fastcgi_pass unix:/run/git-server/fcgiwrap.sock;
      include /etc/nginx/fastcgi_params;
      fastcgi_param SCRIPT_FILENAME /usr/lib/git-core/git-http-backend;
      fastcgi_param GIT_PROJECT_ROOT /srv/git;
      fastcgi_param GIT_HTTP_EXPORT_ALL "";
      fastcgi_param PATH_INFO $1;
      fastcgi_param REMOTE_USER $remote_user;
    }
  }
}
