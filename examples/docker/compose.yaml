# agentfs as a Docker volume with Docker Compose (docs/docker.md): an
# init step, the agentfs container, and a workload that uses the mount.
#
#   mkdir -p examples/docker/mnt    # Docker does not create it
#   docker compose -f examples/docker/compose.yaml up -d
#   docker compose -f examples/docker/compose.yaml exec workload sh
#   docker compose -f examples/docker/compose.yaml down
#
# The history stays in the Docker volume `data`, in
# state/history.git. compose.remote.yaml adds a git server and names it as
# a remote (`-f compose.yaml -f compose.remote.yaml`); push is not built on
# tree volumes yet, so the mount logs that remote as not built at every
# boot.
#
#   ./mnt                 on the host: the directory the mount appears in
#   ./mnt/workspace       the FUSE mount; the workload's /agentfs/workspace
#   data (volume)         /data in the agentfs containers only: state/,
#                         the volume's state area (its files, journal and
#                         history.git)
#
# ./mnt must be on a shared mount (it is on systemd hosts, where / is
# shared); Docker Desktop cannot propagate mounts to the host.

name: agentfs-example

x-agentfs: &agentfs
  image: ${AGENTFS_IMAGE:-ghcr.io/mcurcio/agentfs:latest}
  environment: &agentfs-env
    AGENTFS_STATE: /data/state
  volumes:
    - data:/data
    - ./config/local:/etc/agentfs/config:ro

services:
  # Creates the volume on the first run and finds it on every later one
  # (another volume, or a recording state area, stops here), makes the
  # operator settings file include the config file, and records a new
  # volume's root as the workload's user's, so it can write at the top of
  # the volume.
  agentfs-init:
    <<: *agentfs
    environment:
      <<: *agentfs-env
      AGENTFS_VOLUME: ${VOLUME:-example}
      WORKLOAD_USER: ${WORKLOAD_USER:-10000:10000}
    entrypoint: [sh, -c]
    command: ['agentfs init --include /etc/agentfs/config --owner "$$WORKLOAD_USER"']
    restart: "no"

  # The recorder. FUSE needs /dev/fuse and CAP_SYS_ADMIN, and Docker's
  # AppArmor profile denies mount(2), so it runs unconfined
  # (`privileged: true` covers all three, and more).
  agentfs:
    <<: *agentfs
    hostname: agentfs
    command: [mount, /agentfs/workspace]
    environment:
      <<: *agentfs-env
      # Restarted after a crash: stack over the stale mount the dead daemon
      # left; the new mount reaches the workload through propagation, with
      # no restart of the workload.
      AGENTFS_ON_STALE_MOUNT: recover
      # The bare mount point becomes root's with mode 0000.
      AGENTFS_SEAL_MOUNTPOINT: "true"
      # Point this at your collector instead (docs/telemetry.md): it
      # carries agentfs.not_built, the alarm for settings not built yet.
      OTEL_SDK_DISABLED: "true"
    devices: [/dev/fuse]
    cap_add: [SYS_ADMIN]
    security_opt: [apparmor:unconfined]
    volumes:
      - data:/data
      - ./config/local:/etc/agentfs/config:ro
      # The mount propagates to the host (and from there to the workload).
      - type: bind
        source: ./mnt
        target: /agentfs
        bind:
          propagation: rshared
    restart: unless-stopped
    # Time for the drain at `docker compose down`, once the workload has
    # stopped.
    stop_grace_period: 60s
    # The workload starts once the mount is live; 5 minutes for the
    # volume's recovery at start.
    healthcheck:
      test: [CMD, agentfs, probe, /agentfs/workspace]
      interval: 10s
      timeout: 5s
      start_period: 300s
      start_interval: 1s
    depends_on:
      agentfs-init:
        condition: service_completed_successfully

  # Your workload: any image and any user. It never sees /data.
  workload:
    image: ${WORKLOAD_IMAGE:-debian:trixie-slim@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f}
    command: [sh, -c, "trap 'exit 0' TERM; while :; do sleep 1; done"]
    user: ${WORKLOAD_USER:-10000:10000}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    working_dir: /agentfs/workspace
    volumes:
      # Read-only and rslave: the FUSE mount inside (and the one that
      # replaces it after a crash) propagates in and stays writable
      # (recursive: writable), while the bare directory under it is
      # read-only, so nothing is written where nothing records it while no
      # daemon is mounted.
      - type: bind
        source: ./mnt
        target: /agentfs
        read_only: true
        bind:
          propagation: rslave
          recursive: writable
    depends_on:
      agentfs:
        condition: service_healthy

volumes:
  data:
