name: phase-1

on:
  push:
    branches: ['wip/agentfs-eh5.4*']
    paths:
      - 'crates/**'
      - 'ci/**'
      - 'vendor/**'
      - 'Cargo.*'
      - '.github/workflows/phase-1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  conformance:
    name: phase 1 mounted conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: phase-1-conformance
      - run: sudo apt-get update && sudo apt-get install -y fuse3 git python3 util-linux curl gcc zlib1g-dev
      - run: ci/check-tree-git.sh
      - run: cargo test --manifest-path vendor/fuser/Cargo.toml --lib raw_tmpfile_request_dispatches_and_returns_create_reply
      - run: cargo build --locked -p agentfs -p agentfs-model --bin agentfs --bin phase1-oracle
      # The model records its in-scope scenarios and seeds; the same calls replay
      # on a fresh model, the real library and real mounts (VERIFYING.md, "Phase 1").
      # A floor is the count on landing: a trace that leaves the scope fails here.
      - name: record the model's calls
        if: success() || failure()
        run: cargo test --locked -p agentfs-model --test scenarios --test interleavings
        env:
          AGENTFS_MODEL_TRACE_DIR: ${{ runner.temp }}/traces
      - run: cargo build --locked -p agentfs-conformance --bin phase1-replay
      - run: cargo build --locked -p agentfs --features failpoints
      - name: replay on mounts
        run: ci/e2e-tree-replay.sh "$RUNNER_TEMP/traces" 0 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: phase-1-conformance
          path: |
            ${{ runner.temp }}/conformance.json
            ${{ runner.temp }}/conformance.log
            ${{ runner.temp }}/traces/*.trace

