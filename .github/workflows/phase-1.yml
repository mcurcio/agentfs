name: phase-1

on:
  push:
    branches: [wip/agentfs-eh5.3-m3.12e]
    paths:
      - 'crates/**'
      - 'ci/**'
      - 'vendor/**'
      - 'Cargo.*'
      - '.github/workflows/phase-1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  page-cache:
    name: phase 1 two-writer page cache
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: phase-1-page-cache
      - run: sudo apt-get update && sudo apt-get install -y fuse3 git python3
      - run: ci/check-tree-git.sh
      - run: cargo build --locked -p agentfs
      - run: |
          set -o pipefail
          ci/e2e-tree-pagecache.sh 2>&1 | tee "$RUNNER_TEMP/page-cache.log"
        env:
          PAGECACHE_REPORT: ${{ runner.temp }}/page-cache.json
          AGENTFS_BIN: ${{ github.workspace }}/target/debug/agentfs
      - name: view-host restart with handles open
        if: success() || failure()
        run: ci/e2e-tree-restart.sh
        env:
          AGENTFS_BIN: ${{ github.workspace }}/target/debug/agentfs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: phase-1-page-cache
          path: |
            ${{ runner.temp }}/page-cache.json
            ${{ runner.temp }}/page-cache.log

