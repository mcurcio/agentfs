name: phase-1

on:
  push:
    branches: [docs/target-architecture]
    paths:
      - 'crates/**'
      - 'ci/**'
      - 'vendor/**'
      - 'Cargo.*'
      - '.github/workflows/phase-1.yml'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  conformance:
    name: phase 1 mounted conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: phase-1-conformance
      - run: sudo apt-get update && sudo apt-get install -y fuse3 git python3 util-linux curl gcc zlib1g-dev
      - uses: ./.github/actions/pinned-git
      - run: cargo test --manifest-path vendor/fuser/Cargo.toml --lib raw_tmpfile_request_dispatches_and_returns_create_reply
      - run: cargo build --locked -p agentfs -p agentfs-model --bin agentfs --bin phase1-oracle
      - run: |
          set -o pipefail
          ci/e2e-tree-conformance.sh 2>&1 | tee "$RUNNER_TEMP/conformance.log"
        env:
          AGENTFS_BIN: ${{ github.workspace }}/target/debug/agentfs
          AGENTFS_MODEL_ORACLE: ${{ github.workspace }}/target/debug/phase1-oracle
          AGENTFS_CONFORMANCE_REPORT: ${{ runner.temp }}/conformance.json
      # The model records its in-scope scenarios and seeds; the same calls replay
      # on a fresh model, the real library and real mounts (VERIFYING.md, "Phase 1").
      # A floor is the count on landing: a trace that leaves the scope fails here.
      - name: record the model's calls
        if: success() || failure()
        run: cargo test --locked -p agentfs-model --test scenarios --test interleavings
        env:
          AGENTFS_MODEL_TRACE_DIR: ${{ runner.temp }}/traces
      - run: cargo build --locked -p agentfs-conformance --bin phase1-replay
      - name: replay on a fresh model
        run: target/debug/phase1-replay model "$RUNNER_TEMP/traces" --min-scenarios 74 --min-seeds 94
      - name: replay on the library
        run: target/debug/phase1-replay library "$RUNNER_TEMP/traces" --min-scenarios 74 --min-seeds 94
      - run: cargo build --locked -p agentfs --features failpoints
      - name: replay on mounts
        run: ci/e2e-tree-replay.sh "$RUNNER_TEMP/traces" 71 16 "$RUNNER_TEMP/recorded"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: phase-1-conformance
          path: |
            ${{ runner.temp }}/conformance.json
            ${{ runner.temp }}/conformance.log
            ${{ runner.temp }}/traces/*.trace
            ${{ runner.temp }}/recorded/*.trace

  # `[phase1-seeds]` in the pushed commit message, or a manual run: the library's
  # replay of the phase 1 generators at seeds 1 to 500. Four jobs of about an hour's
  # work each between them, not worth every push.
  replay-seeds:
    name: phase 1 replay at 500 seeds (shard ${{ matrix.shard }})
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[phase1-seeds]')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: phase-1-replay-seeds
      - run: sudo apt-get update && sudo apt-get install -y git gcc zlib1g-dev
      - uses: ./.github/actions/pinned-git
      - run: ci/replay-seeds.sh "${{ matrix.shard }}" 4 500 "$RUNNER_TEMP/traces"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: phase-1-replay-seeds-${{ matrix.shard }}
          path: ${{ runner.temp }}/traces

  page-cache:
    name: phase 1 two-writer page cache
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: phase-1-page-cache
      - run: sudo apt-get update && sudo apt-get install -y fuse3 git python3
      - uses: ./.github/actions/pinned-git
      - run: cargo build --locked -p agentfs
      - run: |
          set -o pipefail
          ci/e2e-tree-pagecache.sh 2>&1 | tee "$RUNNER_TEMP/page-cache.log"
        env:
          PAGECACHE_REPORT: ${{ runner.temp }}/page-cache.json
          AGENTFS_BIN: ${{ github.workspace }}/target/debug/agentfs
      - name: view-host restart with handles open
        if: success() || failure()
        run: ci/e2e-tree-restart.sh
        env:
          AGENTFS_BIN: ${{ github.workspace }}/target/debug/agentfs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: phase-1-page-cache
          path: |
            ${{ runner.temp }}/page-cache.json
            ${{ runner.temp }}/page-cache.log

  recording-faults:
    name: phase 1 journal and state exhaustion
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: phase-1-faults
      - run: sudo apt-get update && sudo apt-get install -y fuse3 git python3 util-linux curl gcc zlib1g-dev
      - uses: ./.github/actions/pinned-git
      - run: cargo build --locked -p agentfs --features failpoints
      - name: kill at recording boundaries
        run: ci/e2e-tree-recording-faults.sh
        env:
          AGENTFS_BIN: ${{ github.workspace }}/target/debug/agentfs
          TREE_FAULT_DIR: ${{ runner.temp }}/tree-faults
      - name: actual state filesystem exhaustion
        if: success() || failure()
        run: ci/e2e-tree-enospc.sh
        env:
          AGENTFS_BIN: ${{ github.workspace }}/target/debug/agentfs
          TREE_ENOSPC_DIR: ${{ runner.temp }}/tree-enospc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: phase-1-recording-faults
          path: |
            ${{ runner.temp }}/tree-faults/**/results.tsv
            ${{ runner.temp }}/tree-faults/**/*.log
            ${{ runner.temp }}/tree-faults/**/receipts*
            ${{ runner.temp }}/tree-enospc/**/results.tsv
            ${{ runner.temp }}/tree-enospc/**/*.log

  power-loss:
    name: phase 1 power loss (${{ matrix.fs }}, flush)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        fs: [ext4, xfs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: phase-1-power-loss
      - run: sudo apt-get update && sudo apt-get install -y fuse3 git python3 util-linux e2fsprogs xfsprogs kmod dmsetup curl gcc zlib1g-dev strace
      - uses: ./.github/actions/pinned-git
      - name: device mapper modules
        run: |
          uname -a
          if ! sudo modprobe dm_log_writes; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe dm_log_writes
          fi
          sudo modprobe dm_snapshot
      - run: ci/install-replay-log.sh "$RUNNER_TEMP/replay-log" >> "$GITHUB_ENV"
      - run: cargo build --locked -p agentfs
      - name: replay each flush checkpoint
        run: sudo env PATH="$PATH" REPLAY_LOG="$REPLAY_LOG" AGENTFS_BIN="$AGENTFS_BIN" POWER_LOSS_DIR="$POWER_LOSS_DIR" ci/power-loss-trees.sh "${{ matrix.fs }}" flush
        env:
          AGENTFS_BIN: ${{ github.workspace }}/target/debug/agentfs
          POWER_LOSS_DIR: ${{ runner.temp }}/tree-power-loss
      - name: object directories sync before the record
        if: matrix.fs == 'ext4'
        run: sudo env PATH="$PATH" AGENTFS_BIN="$AGENTFS_BIN" TMPDIR="$RUNNER_TEMP" ci/trees-object-dir-syncs.sh
        env:
          AGENTFS_BIN: ${{ github.workspace }}/target/debug/agentfs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: phase-1-power-loss-${{ matrix.fs }}
          path: |
            ${{ runner.temp }}/tree-power-loss-artifacts/**/*.tsv
            ${{ runner.temp }}/tree-power-loss-artifacts/**/*.log
            ${{ runner.temp }}/tree-power-loss-artifacts/**/external-receipts

  measure-harness:
    name: phase 1 measurement harness (kill leaves a report)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: phase-1-measure
      - run: sudo apt-get update && sudo apt-get install -y fuse3 git python3 util-linux curl gcc zlib1g-dev
      - uses: ./.github/actions/pinned-git
      - run: cargo test --locked -p agentfs-core --test tree_stages
      - run: cargo build --locked -p agentfs
      - run: ci/measure-trees.sh smoke-kill "$RUNNER_TEMP/smoke-kill.json"
        env:
          AGENTFS_BIN: ${{ github.workspace }}/target/debug/agentfs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: phase-1-measure-smoke-kill
          path: |
            ${{ runner.temp }}/smoke-kill.json
            ${{ runner.temp }}/smoke-kill.json.samples.jsonl

  # `[phase1-pilot]` in the pushed commit message runs the 1,000-save pilot
  # alone, `[phase1-held]` the held-log mode alone, `[phase1-calls]` the calls
  # mode alone, `[phase1-measure]` every mode.
  measure-plan:
    name: phase 1 measurement plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      modes: ${{ steps.plan.outputs.modes }}
    steps:
      - id: plan
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$MESSAGE" == *'[phase1-measure]'* ]]; then
            echo 'modes=["pilot","held-log","calls","hour","storage"]' >> "$GITHUB_OUTPUT"
          elif [[ "$MESSAGE" == *'[phase1-pilot]'* ]]; then
            echo 'modes=["pilot"]' >> "$GITHUB_OUTPUT"
          elif [[ "$MESSAGE" == *'[phase1-held]'* ]]; then
            echo 'modes=["held-log"]' >> "$GITHUB_OUTPUT"
          elif [[ "$MESSAGE" == *'[phase1-calls]'* ]]; then
            echo 'modes=["calls"]' >> "$GITHUB_OUTPUT"
          else
            echo 'modes=[]' >> "$GITHUB_OUTPUT"
          fi

  measurements:
    name: phase 1 measurements (${{ matrix.mode }})
    needs: measure-plan
    if: needs.measure-plan.outputs.modes != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(needs.measure-plan.outputs.modes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: phase-1-measure
      - run: sudo apt-get update && sudo apt-get install -y fuse3 bindfs git python3 util-linux curl gcc zlib1g-dev
      # bindfs, the plain-FUSE baseline, mounts with allow_other.
      - run: echo user_allow_other | sudo tee -a /etc/fuse.conf
      - uses: ./.github/actions/pinned-git
      - run: cargo build --locked -p agentfs
      # Inside the job's 120 minutes, so the upload below still runs when the
      # step is cut: the report on disk says what the run reached.
      - run: ci/measure-trees.sh "${{ matrix.mode }}" "$RUNNER_TEMP/${{ matrix.mode }}.json"
        timeout-minutes: 110
        env:
          AGENTFS_BIN: ${{ github.workspace }}/target/debug/agentfs
          MEASURE_TREES_LANDING: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: phase-1-measure-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/*.json
            ${{ runner.temp }}/*.samples.jsonl
            ${{ runner.temp }}/*.mount.log
