name: image

# The container image (Dockerfile) and the Kubernetes deployment
# (deploy/sidecar): built on every push and pull request, tested in a kind
# cluster, and published to ghcr.io/mcurcio/agentfs from main once the
# test passes (docs/deployment.md). The CSI chart's git server image
# (examples/docker/git-server) likewise, published to
# ghcr.io/mcurcio/agentfs-git-server (docs/helm.md).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: render the manifests
        run: |
          kubectl version --client
          kubectl kustomize deploy/sidecar >/dev/null
          kubectl kustomize ci/k8s >/dev/null
          kubectl kustomize deploy/csi >/dev/null
          kubectl kustomize deploy/csi/example >/dev/null
          kubectl kustomize ci/k8s-csi/driver >/dev/null
          kubectl kustomize ci/k8s-csi/apps >/dev/null
          kubectl kustomize ci/k8s-csi/negative >/dev/null
          kubectl kustomize ci/k8s-csi/forks/driver >/dev/null
          kubectl kustomize ci/k8s-csi/forks/apps >/dev/null
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/mcurcio/agentfs
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
          # The repository has no description: keep the Dockerfile's.
          labels: |
            org.opencontainers.image.description=Records every change an agent makes to a directory, in git history the agent cannot see
      - name: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: |
            agentfs:ci
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=${{ runner.temp }}/agentfs-image.tar
          cache-from: type=gha,scope=agentfs-image
          cache-to: type=gha,scope=agentfs-image,mode=max
          provenance: false
      - name: inspect
        run: |
          docker load -i "$RUNNER_TEMP/agentfs-image.tar"
          docker image ls agentfs
          docker run --rm agentfs:ci --version
          docker run --rm --entrypoint sh agentfs:ci -c 'id; fusermount3 -V; git --version'
          docker run --rm --entrypoint agentfs-csi agentfs:ci --version
          docker run --rm --entrypoint tini agentfs:ci --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentfs-image
          path: ${{ runner.temp }}/agentfs-image.tar
          retention-days: 1

  e2e-kind:
    name: e2e (kind cluster)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agentfs-image
          path: ${{ runner.temp }}
      - name: FUSE, nginx and fcgiwrap
        run: |
          sudo modprobe fuse
          ls -l /dev/fuse
          uname -a
          sudo apt-get update && sudo apt-get install -y nginx fcgiwrap
      - name: install kind and kubectl
        run: |
          ci/install-kind.sh "$RUNNER_TEMP/kind" >>"$GITHUB_ENV"
          echo "$RUNNER_TEMP/kind/bin" >>"$GITHUB_PATH"
      - name: create the cluster
        run: |
          kind version
          kind create cluster --name agentfs-e2e --config ci/kind/cluster.yaml \
            --image "$KIND_NODE_IMAGE" --wait 120s
          kind load image-archive "$RUNNER_TEMP/agentfs-image.tar" --name agentfs-e2e
          kubectl get nodes -o wide
      - name: start git server
        run: |
          GIT_SERVER_EXTRA_LISTEN=$(ci/e2e-kind.sh gateway) \
            ci/git-http-server.sh start "$RUNNER_TEMP/git-server" >>"$GITHUB_ENV"
      - run: ci/e2e-kind.sh
      - name: diagnose
        if: failure()
        run: ci/e2e-kind.sh diagnose
      - name: clean up
        if: always()
        run: |
          kind delete cluster --name agentfs-e2e || true
          ci/git-http-server.sh stop "$RUNNER_TEMP/git-server"

  e2e-csi:
    name: e2e (CSI driver on kind)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agentfs-image
          path: ${{ runner.temp }}
      - name: FUSE, nginx and fcgiwrap
        run: |
          sudo modprobe fuse
          ls -l /dev/fuse
          uname -a
          sudo apt-get update && sudo apt-get install -y nginx fcgiwrap
      - name: install kind and kubectl
        run: |
          ci/install-kind.sh "$RUNNER_TEMP/kind" >>"$GITHUB_ENV"
          echo "$RUNNER_TEMP/kind/bin" >>"$GITHUB_PATH"
      - name: create the cluster
        run: |
          kind version
          kind create cluster --name agentfs-csi --config ci/kind/cluster.yaml \
            --image "$KIND_NODE_IMAGE" --wait 120s
          kind load image-archive "$RUNNER_TEMP/agentfs-image.tar" --name agentfs-csi
          kubectl get nodes -o wide
      - name: start git server
        run: |
          GIT_SERVER_EXTRA_LISTEN=$(ci/e2e-csi.sh gateway) \
            ci/git-http-server.sh start "$RUNNER_TEMP/git-server" >>"$GITHUB_ENV"
      - run: ci/e2e-csi.sh
      - name: diagnose
        if: failure()
        run: ci/e2e-csi.sh diagnose
      - name: clean up
        if: always()
        run: |
          kind delete cluster --name agentfs-csi || true
          ci/git-http-server.sh stop "$RUNNER_TEMP/git-server"

  # Forked volumes on the CSI driver (ci/e2e-csi-forks.sh): its own job,
  # so e2e-csi's wall time is unchanged; the cost is one more runner.
  e2e-csi-forks:
    name: e2e (forked volumes on the CSI driver)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agentfs-image
          path: ${{ runner.temp }}
      - name: FUSE, nginx and fcgiwrap
        run: |
          sudo modprobe fuse
          ls -l /dev/fuse
          sudo apt-get update && sudo apt-get install -y nginx fcgiwrap
      - name: install kind and kubectl
        run: |
          ci/install-kind.sh "$RUNNER_TEMP/kind" >>"$GITHUB_ENV"
          echo "$RUNNER_TEMP/kind/bin" >>"$GITHUB_PATH"
      - name: create the cluster
        run: |
          docker load -i "$RUNNER_TEMP/agentfs-image.tar"
          kind create cluster --name agentfs-forks --config ci/kind/cluster.yaml \
            --image "$KIND_NODE_IMAGE" --wait 120s
          kind load image-archive "$RUNNER_TEMP/agentfs-image.tar" --name agentfs-forks
          kubectl get nodes -o wide
      - name: start git server
        run: |
          GIT_SERVER_EXTRA_LISTEN=$(ci/e2e-csi-forks.sh gateway) \
            ci/git-http-server.sh start "$RUNNER_TEMP/git-server" >>"$GITHUB_ENV"
      - run: ci/e2e-csi-forks.sh
      - name: diagnose
        if: failure()
        run: ci/e2e-csi-forks.sh diagnose
      - name: clean up
        if: always()
        run: |
          kind delete cluster --name agentfs-forks || true
          ci/git-http-server.sh stop "$RUNNER_TEMP/git-server"

  # The chart's git server image (examples/docker/git-server, docs/helm.md
  # "The git server"): built, then a push and a refused password as the
  # chart runs it (uid 33, read-only root filesystem, htpasswd from a
  # file). The chart on kind is f8.yml's e2e-chart-server.
  git-server:
    name: git server image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build
        run: |
          docker build -t agentfs-git-server:ci \
            --label org.opencontainers.image.source=https://github.com/mcurcio/agentfs \
            --label "org.opencontainers.image.description=The agentfs CSI chart's minimal git server" \
            examples/docker/git-server
      - name: a push, and a wrong password refused
        run: |
          d=$RUNNER_TEMP/git-server
          mkdir -p "$d/credentials" "$d/repos" "$d/work"
          chmod 0777 "$d/repos"
          docker run --rm --entrypoint sh agentfs-git-server:ci \
            -c 'printf "agentfs:%s\n" "$(openssl passwd -apr1 smoke-password)"' >"$d/credentials/htpasswd"
          as_chart() { docker run --user 33:33 --read-only -v "$d/repos:/srv/git" "$@"; }
          as_chart --rm agentfs-git-server:ci init
          as_chart -d --name git-server --tmpfs /run/git-server:mode=1777 -p 18080:8080 \
            -e GIT_SERVER_HTPASSWD=/credentials/htpasswd -v "$d/credentials:/credentials:ro" \
            agentfs-git-server:ci serve
          url=http://agentfs:smoke-password@127.0.0.1:18080/git/history.git
          for _ in $(seq 30); do git ls-remote "$url" && break; sleep 1; done
          git -C "$d/work" init -q -b main
          git -C "$d/work" -c user.name=ci -c user.email=ci@ci.invalid commit -q --allow-empty -m smoke
          git -C "$d/work" push "$url" HEAD:refs/heads/agentfs/smoke
          test "$(git ls-remote "$url" refs/heads/agentfs/smoke | cut -f1)" = "$(git -C "$d/work" rev-parse HEAD)"
          if GIT_TERMINAL_PROMPT=0 git ls-remote http://agentfs:wrong@127.0.0.1:18080/git/history.git; then
            echo "::error::the git server accepted a wrong password"; exit 1
          fi
          docker logs git-server 2>&1 | grep 'password mismatch'
      - name: logs
        if: failure()
        run: docker logs git-server || true
      - name: save
        run: docker save agentfs-git-server:ci -o "$RUNNER_TEMP/git-server-image.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: git-server-image
          path: ${{ runner.temp }}/git-server-image.tar
          retention-days: 1

  # Pushes the git server image the job above tested, from main only, as
  # ghcr.io/mcurcio/agentfs-git-server:<commit> (the chart's appVersion)
  # and :latest.
  publish-git-server:
    needs: git-server
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ci/publish-image.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: git-server-image
          path: ${{ runner.temp }}
      - run: docker load -i "$RUNNER_TEMP/git-server-image.tar"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push
        env:
          SHA: ${{ github.sha }}
        run: ci/publish-image.sh agentfs-git-server:ci ghcr.io/mcurcio/agentfs-git-server "$SHA"

  # Pushes the image e2e-kind, e2e-csi and e2e-csi-forks tested (the same
  # tar, not a rebuild), from main only.
  publish:
    needs: [build, e2e-kind, e2e-csi, e2e-csi-forks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ci/publish-image.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agentfs-image
          path: ${{ runner.temp }}
      - run: docker load -i "$RUNNER_TEMP/agentfs-image.tar"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push
        env:
          SHA: ${{ github.sha }}
        run: ci/publish-image.sh agentfs:ci ghcr.io/mcurcio/agentfs "$SHA"
