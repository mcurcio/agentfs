name: image

# The container image (Dockerfile) and the Kubernetes deployment
# (deploy/sidecar): built on every push and pull request, tested in a kind
# cluster, and published to ghcr.io/mcurcio/agentfs from main once the
# test passes (docs/deployment.md).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: render the manifests
        run: |
          kubectl version --client
          kubectl kustomize deploy/sidecar >/dev/null
          kubectl kustomize ci/k8s >/dev/null
          kubectl kustomize deploy/csi >/dev/null
          kubectl kustomize deploy/csi/example >/dev/null
          kubectl kustomize ci/k8s-csi/driver >/dev/null
          kubectl kustomize ci/k8s-csi/apps >/dev/null
          kubectl kustomize ci/k8s-csi/negative >/dev/null
          kubectl kustomize ci/k8s-csi/multinode >"$RUNNER_TEMP/multinode.yaml" ||
            { echo "::error::kubectl kustomize ci/k8s-csi/multinode failed"; exit 1; }
          n=$(grep -c -- '- --multi-node$' "$RUNNER_TEMP/multinode.yaml" || true)
          [ "$n" = 2 ] || { echo "::error::ci/k8s-csi/multinode sets --multi-node $n time(s), not 2"; exit 1; }
          kubectl kustomize ci/k8s-csi/multinode-apps >/dev/null ||
            { echo "::error::kubectl kustomize ci/k8s-csi/multinode-apps failed"; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/mcurcio/agentfs
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
          # The repository has no description: keep the Dockerfile's.
          labels: |
            org.opencontainers.image.description=Records every change an agent makes to a directory, in git history the agent cannot see
      - name: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: |
            agentfs:ci
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=${{ runner.temp }}/agentfs-image.tar
          cache-from: type=gha,scope=agentfs-image
          cache-to: type=gha,scope=agentfs-image,mode=max
          provenance: false
      - name: inspect
        run: |
          docker load -i "$RUNNER_TEMP/agentfs-image.tar"
          docker image ls agentfs
          docker run --rm agentfs:ci --version
          docker run --rm --entrypoint sh agentfs:ci -c 'id; fusermount3 -V; git --version'
          docker run --rm --entrypoint agentfs-csi agentfs:ci --version
          docker run --rm --entrypoint tini agentfs:ci --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentfs-image
          path: ${{ runner.temp }}/agentfs-image.tar
          retention-days: 1

  e2e-kind:
    name: e2e (kind cluster)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agentfs-image
          path: ${{ runner.temp }}
      - name: FUSE, nginx and fcgiwrap
        run: |
          sudo modprobe fuse
          ls -l /dev/fuse
          uname -a
          sudo apt-get update && sudo apt-get install -y nginx fcgiwrap
      - name: install kind and kubectl
        run: |
          ci/install-kind.sh "$RUNNER_TEMP/kind" >>"$GITHUB_ENV"
          echo "$RUNNER_TEMP/kind/bin" >>"$GITHUB_PATH"
      - name: create the cluster
        run: |
          kind version
          kind create cluster --name agentfs-e2e --config ci/kind/cluster.yaml \
            --image "$KIND_NODE_IMAGE" --wait 120s
          kind load image-archive "$RUNNER_TEMP/agentfs-image.tar" --name agentfs-e2e
          kubectl get nodes -o wide
      - name: start git server
        run: |
          GIT_SERVER_EXTRA_LISTEN=$(ci/e2e-kind.sh gateway) \
            ci/git-http-server.sh start "$RUNNER_TEMP/git-server" >>"$GITHUB_ENV"
      - run: ci/e2e-kind.sh
      - name: diagnose
        if: failure()
        run: ci/e2e-kind.sh diagnose
      - name: clean up
        if: always()
        run: |
          kind delete cluster --name agentfs-e2e || true
          ci/git-http-server.sh stop "$RUNNER_TEMP/git-server"

  e2e-csi:
    name: e2e (CSI driver on kind)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agentfs-image
          path: ${{ runner.temp }}
      - name: FUSE, nginx and fcgiwrap
        run: |
          sudo modprobe fuse
          ls -l /dev/fuse
          uname -a
          sudo apt-get update && sudo apt-get install -y nginx fcgiwrap
      - name: install kind and kubectl
        run: |
          ci/install-kind.sh "$RUNNER_TEMP/kind" >>"$GITHUB_ENV"
          echo "$RUNNER_TEMP/kind/bin" >>"$GITHUB_PATH"
      - name: create the cluster
        run: |
          kind version
          kind create cluster --name agentfs-csi --config ci/kind/cluster.yaml \
            --image "$KIND_NODE_IMAGE" --wait 120s
          kind load image-archive "$RUNNER_TEMP/agentfs-image.tar" --name agentfs-csi
          kubectl get nodes -o wide
      - name: start git server
        run: |
          GIT_SERVER_EXTRA_LISTEN=$(ci/e2e-csi.sh gateway) \
            ci/git-http-server.sh start "$RUNNER_TEMP/git-server" >>"$GITHUB_ENV"
      - run: ci/e2e-csi.sh
      - name: diagnose
        if: failure()
        run: ci/e2e-csi.sh diagnose
      - name: clean up
        if: always()
        run: |
          kind delete cluster --name agentfs-csi || true
          ci/git-http-server.sh stop "$RUNNER_TEMP/git-server"

  # The CSI driver on two nodes (design §14.2, §18 test 16): a kind cluster
  # with two workers whose basePath is an NFS export on the runner, the
  # driver with --multi-node, two pods on two nodes on one RWX volume,
  # failover, node reboots and the plugin upgrade procedure.
  e2e-csi-multinode:
    name: e2e (CSI driver on two nodes over NFS)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agentfs-image
          path: ${{ runner.temp }}
      - name: FUSE, nginx, fcgiwrap
        run: |
          sudo modprobe fuse
          uname -a
          sudo apt-get update && sudo apt-get install -y nginx fcgiwrap
      - name: install kind and kubectl
        run: |
          ci/install-kind.sh "$RUNNER_TEMP/kind" >>"$GITHUB_ENV"
          echo "$RUNNER_TEMP/kind/bin" >>"$GITHUB_PATH"
      - name: create the cluster
        run: |
          kind create cluster --name agentfs-mn --config ci/kind/multinode.yaml \
            --image "$KIND_NODE_IMAGE" --wait 180s
          kind load image-archive "$RUNNER_TEMP/agentfs-image.tar" --name agentfs-mn
          kubectl get nodes -o wide
      - name: NFS server on the kind network, mounted in every node
        run: |
          . ci/lib.sh
          . ci/nfs-lib.sh
          nfs_server "$RUNNER_TEMP/nfs-export"
          GW=$(ci/e2e-csi-multinode.sh gateway)
          for n in $(kind get nodes --name agentfs-mn); do
            ci/kind/nfs-node-mount.sh "$n" "$GW"
          done
      - name: start git server
        run: |
          GIT_SERVER_EXTRA_LISTEN=$(ci/e2e-csi-multinode.sh gateway) \
            ci/git-http-server.sh start "$RUNNER_TEMP/git-server" >>"$GITHUB_ENV"
      - run: ci/e2e-csi-multinode.sh
        env:
          KIND_CLUSTER: agentfs-mn
      - name: diagnose
        if: failure()
        run: ci/e2e-csi-multinode.sh diagnose
        env:
          KIND_CLUSTER: agentfs-mn
      - name: clean up
        if: always()
        run: |
          kind delete cluster --name agentfs-mn || true
          ci/git-http-server.sh stop "$RUNNER_TEMP/git-server" || true
          timeout 30 sudo systemctl stop nfs-server || true

  # Pushes the image e2e-kind, e2e-csi and e2e-csi-multinode tested (the
  # same tar, not a rebuild), from main only.
  publish:
    needs: [build, e2e-kind, e2e-csi, e2e-csi-multinode]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agentfs-image
          path: ${{ runner.temp }}
      - run: docker load -i "$RUNNER_TEMP/agentfs-image.tar"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push
        env:
          SHA: ${{ github.sha }}
        run: |
          for tag in "$SHA" latest; do
            docker push "ghcr.io/mcurcio/agentfs:$tag"
          done
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "ghcr.io/mcurcio/agentfs:$SHA")
          {
            echo "### Published"
            echo
            echo "- \`ghcr.io/mcurcio/agentfs:$SHA\`"
            echo "- \`ghcr.io/mcurcio/agentfs:latest\`"
            echo "- digest: \`$digest\`"
          } >>"$GITHUB_STEP_SUMMARY"
