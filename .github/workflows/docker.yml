name: docker

# The Docker examples (examples/docker, docs/docker.md): the image built
# from this commit, then every example run on the runner with docker and
# docker compose by ci/e2e-docker.sh, one job each, in parallel.

on:
  push:
    paths: &paths
      - Dockerfile
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - examples/docker/**
      - ci/e2e-docker.sh
      - ci/docker/**
      - ci/lib.sh
      - .github/workflows/docker.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Reads the image workflow's layer cache and writes none, so the two
      # workflows never race on it.
      - name: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: agentfs:ci
          outputs: type=docker,dest=${{ runner.temp }}/agentfs-image.tar
          cache-from: type=gha,scope=agentfs-image
          provenance: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentfs-image-docker
          path: ${{ runner.temp }}/agentfs-image.tar
          retention-days: 1

  e2e:
    name: e2e (docker ${{ matrix.example }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        example: [run, compose, compose-remote]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agentfs-image-docker
          path: ${{ runner.temp }}
      - name: FUSE and the image
        run: |
          sudo modprobe fuse
          ls -l /dev/fuse
          uname -a
          docker load -i "$RUNNER_TEMP/agentfs-image.tar"
      - run: ci/e2e-docker.sh ${{ matrix.example }}
      - name: diagnose
        if: failure()
        run: ci/e2e-docker.sh diagnose
