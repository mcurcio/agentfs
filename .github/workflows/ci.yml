name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # cargo-nextest's ci profile (.config/nextest.toml): every failure, no retries.
  NEXTEST_PROFILE: ci

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install # the release rust-toolchain.toml pins
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: ci/apt-install.sh libssl-dev pkg-config
      - run: cargo fmt --all --check
      - name: clippy (default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: clippy (all features)
        run: cargo clippy --workspace --all-targets --locked --all-features -- -D warnings
      # A workspace-wide build turns the engine's test-util on (through
      # agentfs-conformance): these two build the library as a consumer does.
      - name: clippy (the library as a consumer builds it)
        run: cargo clippy --locked -p agentfs-engine -p agentfs-service -p agentfs --lib -- -D warnings
      - name: the front's doctest without test-util
        run: cargo test --doc --locked -p agentfs
      - name: linked C and crypto per feature set
        run: ci/check-deps.sh
      - name: the model's safety net (corpus runner, digest compare, mount refusal, stall alarm)
        run: python3 -m unittest discover -s crates/agentfs-model/planted -p 'test_*.py' -v

  # The documentation against the code: the repository's checks first
  # (agentfs-repo, which builds no engine: every module is in
  # docs/architecture.md, the ranks are kept, every relative link and anchor
  # in README.md and docs/ resolves, the workflows and scripts follow their
  # rules), then every config key, operator attribute, flag and environment
  # variable agentfs reads is in docs/configuration.md (and nothing stale
  # is). The same tests run in the test job; this job names the failure.
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install # the release rust-toolchain.toml pins
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: docs
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.152
      - name: the repository's checks (docs, workflows, scripts, crates)
        run: cargo nextest run --locked -p agentfs-repo
      - name: configuration.md's keys and attributes against the engine
        run: cargo nextest run --locked -p agentfs-core --test config_reference
      - name: config keys read = config::KEYS
        run: cargo nextest run --locked -p agentfs-core --lib config::tests::every_config_read_is_registered
      - name: agentfs flags and environment variables
        run: cargo nextest run --locked -p agentfs-cli --bin agentfs reference_tests plan_reads_only_env_vars
      - name: agentfs-csi flags and environment variables
        run: cargo nextest run --locked -p agentfs-csi --bin agentfs-csi reference_tests

  test:
    name: test (${{ matrix.features }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        features: [default, all]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install # the release rust-toolchain.toml pins
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.features }}
      - run: ci/apt-install.sh libssl-dev pkg-config
      # cli_lfs.rs runs `git lfs pull` when git-lfs is installed; make sure.
      # The model and the library align lines with the image's release of git.
      - uses: ./.github/actions/pinned-git
      - run: git lfs version
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.152
      - run: cargo nextest run --workspace --locked ${{ matrix.features == 'all' && '--all-features' || '' }}
      # nextest does not run doctests.
      - run: cargo test --doc --workspace --locked ${{ matrix.features == 'all' && '--all-features' || '' }}

  e2e-telemetry:
    name: e2e (OpenTelemetry collector)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/docker-hub-mirror
      - run: rustup toolchain install # the release rust-toolchain.toml pins
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: ci/apt-install.sh fuse3 jq
      - run: cargo build --locked -p agentfs-cli --features otlp-tls
      - name: start collector
        run: |
          mkdir -p "$RUNNER_TEMP/otel" && chmod 777 "$RUNNER_TEMP/otel"
          ci/otel-certs.sh "$RUNNER_TEMP/otel-certs"
          docker run -d --name otelcol -p 4317-4322:4317-4322 \
            -v "$PWD/ci/otelcol.yaml:/etc/otelcol-contrib/config.yaml:ro" \
            -v "$RUNNER_TEMP/otel-certs:/certs:ro" \
            -v "$RUNNER_TEMP/otel:/out" \
            otel/opentelemetry-collector-contrib:0.162.0
          for _ in $(seq 60); do
            curl -s -o /dev/null -X POST http://localhost:4318/v1/metrics && break
            sleep 1
          done
      - run: ci/e2e-telemetry.sh
        env:
          OTEL_OUT: ${{ runner.temp }}/otel/otel.jsonl
      - run: ci/e2e-otlp-transports.sh
        env:
          OTEL_OUT: ${{ runner.temp }}/otel/otel.jsonl
          OTEL_CERTS: ${{ runner.temp }}/otel-certs
          E2E_OTLP_TLS: 1
      - name: collector logs
        if: failure()
        run: docker logs otelcol 2>&1 | tail -n 100

  fuse:
    name: e2e (FUSE mount)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install # the release rust-toolchain.toml pins
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fuse
      - run: ci/apt-install.sh fuse3 sqlite3 jq attr
      - name: enable user_allow_other, show the kernel
        run: |
          echo user_allow_other | sudo tee -a /etc/fuse.conf
          python3 --version && sqlite3 --version
          uname -a
          ls -l /dev/fuse
          findmnt -T "$RUNNER_TEMP" || true
      - run: ci/fuse-tests.sh
      # README.md's quick start, as written, as root.
      - name: README quick start
        run: ci/readme-quickstart.sh
      - name: clean up mounts
        if: always()
        run: sudo sh -c 'grep agentfs /proc/self/mountinfo | cut -d" " -f5 | xargs -r -n1 umount -l' || true

  # Crash injection: the failpoint harness, built with
  # the `failpoints` feature (never in release builds), including the
  # mount tests that need root and /dev/fuse.
  crash:
    name: e2e (crash injection at every failpoint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install # the release rust-toolchain.toml pins
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: crash
      - run: ci/apt-install.sh fuse3 jq
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.152
      - run: ci/crash-tests.sh

  trees:
    name: e2e (phase 1 tree views)
    runs-on: ubuntu-24.04
    # A drain that never releases fails here, not at GitHub's 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install # the release rust-toolchain.toml pins
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: trees
      - run: ci/apt-install.sh fuse3
      # The tree views mount with FUSE allow_other by default.
      - run: echo user_allow_other | sudo tee -a /etc/fuse.conf
      - uses: ./.github/actions/pinned-git
      - run: cargo build --locked -p agentfs-cli
      - run: ci/e2e-trees.sh
      - run: ci/e2e-trees-ordering.sh

  csi-sanity:
    name: e2e (csi-sanity against agentfs-csi)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install # the release rust-toolchain.toml pins
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: csi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: ci/apt-install.sh fuse3
      - name: install csi-sanity (pinned)
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/kubernetes-csi/csi-test/v5/cmd/csi-sanity@v5.6.0
          echo "CSI_SANITY=$RUNNER_TEMP/bin/csi-sanity" >>"$GITHUB_ENV"
      - run: cargo build --locked --release -p agentfs-cli -p agentfs-csi
      - run: ci/csi-sanity.sh
      - name: driver logs
        if: failure()
        run: tail -n 400 "$RUNNER_TEMP"/agentfs-csi-logs/*.log
      - name: clean up mounts
        if: always()
        run: sudo sh -c 'grep agentfs /proc/self/mountinfo | cut -d" " -f5 | xargs -r -n1 umount -l' || true
