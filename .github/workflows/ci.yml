name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - run: cargo fmt --all --check
      - name: clippy (default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: clippy (all features)
        run: cargo clippy --workspace --all-targets --locked --all-features -- -D warnings

  test:
    name: test (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [default, all]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.features }}
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      # cli_lfs.rs runs `git lfs pull` when git-lfs is installed; make sure.
      - run: git lfs version
      - run: cargo test --workspace --locked ${{ matrix.features == 'all' && '--all-features' || '' }}

  e2e-remotes:
    name: e2e (http and https remotes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: https
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config nginx fcgiwrap
      - run: cargo build --locked -p agentfs --features https
      - name: start git server
        run: ci/git-http-server.sh start "$RUNNER_TEMP/git-server" --trust-ca >>"$GITHUB_ENV"
      - run: ci/e2e-remotes.sh
        env:
          E2E_HTTPS: 1
      - name: server logs
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP"/git-server/logs/*.log
      - if: always()
        run: ci/git-http-server.sh stop "$RUNNER_TEMP/git-server"

  e2e-patches:
    name: e2e (patch queue over http, FUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: patches
      - run: sudo apt-get update && sudo apt-get install -y nginx fcgiwrap fuse3
      - run: cargo build --locked -p agentfs
      - name: start git server
        run: ci/git-http-server.sh start "$RUNNER_TEMP/git-server" >>"$GITHUB_ENV"
      - run: ci/e2e-patches.sh
      - name: server logs
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP"/git-server/logs/*.log
      - if: always()
        run: ci/git-http-server.sh stop "$RUNNER_TEMP/git-server"

  e2e-ssh:
    name: e2e (ssh remotes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ssh
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config openssh-server openssh-client
      - run: cargo build --locked -p agentfs --features ssh
      - name: start ssh server
        run: ci/git-ssh-server.sh start "$RUNNER_TEMP/ssh-server" >>"$GITHUB_ENV"
      - run: ci/e2e-ssh.sh
      - name: sshd log
        if: failure()
        run: sudo tail -n 200 "$RUNNER_TEMP/ssh-server/sshd.log"
      - if: always()
        run: ci/git-ssh-server.sh stop "$RUNNER_TEMP/ssh-server"

  e2e-telemetry:
    name: e2e (OpenTelemetry collector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked -p agentfs
      - name: start collector
        run: |
          mkdir -p "$RUNNER_TEMP/otel" && chmod 777 "$RUNNER_TEMP/otel"
          docker run -d --name otelcol -p 4318:4318 \
            -v "$PWD/ci/otelcol.yaml:/etc/otelcol-contrib/config.yaml:ro" \
            -v "$RUNNER_TEMP/otel:/out" \
            otel/opentelemetry-collector-contrib:0.162.0
          for _ in $(seq 60); do
            curl -s -o /dev/null -X POST http://localhost:4318/v1/metrics && break
            sleep 1
          done
      - run: ci/e2e-telemetry.sh
        env:
          OTEL_OUT: ${{ runner.temp }}/otel/otel.jsonl
      - name: collector logs
        if: failure()
        run: docker logs otelcol 2>&1 | tail -n 100

  e2e-runbooks:
    name: e2e (operator runbooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y git-filter-repo
      - run: git filter-repo --version && git --version
      - run: cargo build --locked -p agentfs
      - run: ci/e2e-runbooks.sh

  fuse:
    name: e2e (FUSE mount, passthrough ${{ matrix.passthrough }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        passthrough: [auto, on, off]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fuse
      - run: sudo apt-get update && sudo apt-get install -y fuse3 sqlite3 jq attr
      - name: enable user_allow_other, show the kernel
        run: |
          echo user_allow_other | sudo tee -a /etc/fuse.conf
          python3 --version && sqlite3 --version
          uname -a
          ls -l /dev/fuse
          findmnt -T "$RUNNER_TEMP" || true
      - run: ci/fuse-tests.sh
        env:
          AGENTFS_TEST_PASSTHROUGH: ${{ matrix.passthrough }}
          AGENTFS_TEST_UNPRIV_USER: runner
      - run: ci/e2e-recovery.sh
        env:
          AGENTFS_TEST_PASSTHROUGH: ${{ matrix.passthrough }}
      - run: ci/e2e-sqlite.sh
        env:
          AGENTFS_TEST_PASSTHROUGH: ${{ matrix.passthrough }}
      - name: daemon logs
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP"/agentfs-mount-logs/*.log
      - name: clean up mounts
        if: always()
        run: sudo sh -c 'grep agentfs /proc/self/mountinfo | cut -d" " -f5 | xargs -r -n1 umount -l' || true

  e2e-multipod:
    name: e2e (two FUSE mounts, one history service, passthrough ${{ matrix.passthrough }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        passthrough: [auto, off]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: multipod
      - run: sudo apt-get update && sudo apt-get install -y fuse3 jq python3
      - name: enable user_allow_other, show the kernel
        run: |
          echo user_allow_other | sudo tee -a /etc/fuse.conf
          uname -a
          findmnt -T "$RUNNER_TEMP" || true
      - run: cargo build --locked --release -p agentfs
      - run: ci/e2e-multipod.sh
        env:
          AGENTFS_TEST_PASSTHROUGH: ${{ matrix.passthrough }}
          AGENTFS_BIN: ${{ github.workspace }}/target/release/agentfs
      - name: round-trip benchmark
        run: |
          set -o pipefail
          {
            echo "### History service round trip (passthrough ${{ matrix.passthrough }} job; no FUSE)"
            cargo test --locked --release -p agentfs-core --test history_service -- --ignored --nocapture round_trip_cost
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: daemon logs
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP"/agentfs-multipod-logs/*.log
      - name: clean up mounts
        if: always()
        run: sudo sh -c 'grep agentfs /proc/self/mountinfo | cut -d" " -f5 | xargs -r -n1 umount -l' || true

  e2e-lfs:
    name: e2e (Git LFS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: lfs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config nginx fcgiwrap git-lfs
      - name: build lfs-test-server (git-lfs's reference server, pinned)
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/git-lfs/lfs-test-server@d27ad23fddc1949ecd9a4ba6a3d074bc6a567084
          echo "LFS_TEST_SERVER=$RUNNER_TEMP/bin/lfs-test-server" >>"$GITHUB_ENV"
      - run: cargo build --locked -p agentfs --features https
      - name: start git server with LFS routes
        run: GIT_SERVER_LFS=1 ci/git-http-server.sh start "$RUNNER_TEMP/git-server" --trust-ca >>"$GITHUB_ENV"
      - name: start LFS servers
        run: ci/lfs-server.sh start "$RUNNER_TEMP/lfs-server" >>"$GITHUB_ENV"
      - run: ci/e2e-lfs.sh
        env:
          E2E_HTTPS: 1
      - name: server logs
        if: failure()
        run: |
          tail -n 200 "$RUNNER_TEMP"/git-server/logs/*.log
          tail -n 100 "$RUNNER_TEMP"/lfs-server/*.log
      - if: always()
        run: |
          ci/lfs-server.sh stop "$RUNNER_TEMP/lfs-server"
          ci/git-http-server.sh stop "$RUNNER_TEMP/git-server"
