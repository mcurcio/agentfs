name: f8

# F8: end-to-end jobs on kind, each on its own runner, against the
# tree-engine CSI driver. e2e-csi-move keeps volumes node-local on the two
# workers of ci/kind/two-workers.yaml: moving a volume between nodes
# (`startFrom`) is refused by design until its slice lands
# (ci/e2e-csi-move.sh, docs/runbooks/moving.md), and a deleted claim's
# directory is kept on its node. e2e-chart-server runs the chart's own git
# server (server.enabled, ci/e2e-chart-server.sh, docs/helm.md): the
# server works, and pushing to it is logged as not built.
# e2e-csi-fork-of-fork asserts that a fork claim of a fork claim is refused
# by design until nested forks are built (ci/e2e-csi-fork-of-fork.sh,
# docs/target-architecture/future/nested-forks.md).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f8-${{ github.ref }}
  cancel-in-progress: true

# bash -eo pipefail: a failure inside a pipe fails the step.
defaults:
  run:
    shell: bash

env:
  HELM_VERSION: v3.22.1

jobs:
  # Node-local volumes on two workers (ci/e2e-csi-move.sh): a move between
  # nodes is refused (`startFrom is not built on tree volumes`).
  e2e-csi-move:
    name: e2e (CSI move between nodes)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: ./.github/actions/docker-hub-mirror
        with:
          buildx: true
      # The image as image.yml builds it, from its cache (read only here).
      - name: build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: agentfs:ci
          cache-from: type=gha,scope=agentfs-image
          provenance: false
      - name: FUSE
        run: |
          sudo modprobe fuse
          ls -l /dev/fuse
          uname -a
      - name: install kind and kubectl
        uses: ./.github/actions/kind
      - name: create the cluster
        run: |
          ci/kind-cluster.sh agentfs-move ci/kind/two-workers.yaml 180s
          kind load docker-image agentfs:ci --name agentfs-move
          kubectl get nodes -o wide
      - run: ci/e2e-csi-move.sh
      - name: diagnose
        if: failure()
        run: ci/e2e-csi-move.sh diagnose
      - name: clean up
        if: always()
        run: kind delete cluster --name agentfs-move || true

  # The CSI chart's git server (server.enabled): ci/e2e-chart-server.sh on
  # one kind node, with charts/agentfs-csi/ci/server.yaml. The server takes
  # the runner's push; the volume's host logs its remote as not built.
  e2e-chart-server:
    name: e2e (the chart's git server)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: ./.github/actions/docker-hub-mirror
        with:
          buildx: true
      # The image as image.yml builds it, from its cache (read only here).
      - name: build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: agentfs:ci
          cache-from: type=gha,scope=agentfs-image
          provenance: false
      - name: build the git server image
        run: docker build -t agentfs-git-server:ci examples/docker/git-server
      - name: FUSE
        run: |
          sudo modprobe fuse
          ls -l /dev/fuse
      - name: install kind and kubectl
        uses: ./.github/actions/kind
      - name: create the cluster
        run: |
          ci/kind-cluster.sh agentfs-server ci/kind/cluster.yaml 120s
          kind load docker-image agentfs:ci agentfs-git-server:ci --name agentfs-server
          kubectl get nodes -o wide
      - run: ci/e2e-chart-server.sh
      - name: diagnose
        if: failure()
        run: ci/e2e-chart-server.sh diagnose
      - name: clean up
        if: always()
        run: kind delete cluster --name agentfs-server || true

  # Forks of forks on the CSI driver (ci/e2e-csi-fork-of-fork.sh): a child
  # fork claim binds and lands in its source; a fork claim of the child is
  # refused (`forks of forks are not built`). The git server
  # (ci/git-http-server.sh) is the profile's remote, logged as not built:
  # the job checks it never gets a ref.
  e2e-csi-fork-of-fork:
    name: e2e (CSI forks of forks)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/docker-hub-mirror
        with:
          buildx: true
      # The image as image.yml builds it, from its cache (read only here).
      - name: build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: agentfs:ci
          cache-from: type=gha,scope=agentfs-image
          provenance: false
      - name: FUSE, nginx and fcgiwrap
        run: |
          sudo modprobe fuse
          ls -l /dev/fuse
          ci/apt-install.sh nginx fcgiwrap
      - name: install kind and kubectl
        uses: ./.github/actions/kind
      - name: create the cluster
        run: |
          ci/kind-cluster.sh agentfs-fork-of-fork ci/kind/cluster.yaml 120s
          kind load docker-image agentfs:ci --name agentfs-fork-of-fork
          kubectl get nodes -o wide
      - name: start git server
        run: |
          GIT_SERVER_EXTRA_LISTEN=$(ci/e2e-csi-fork-of-fork.sh gateway) \
            ci/git-http-server.sh start "$RUNNER_TEMP/git-server" >>"$GITHUB_ENV"
      - run: ci/e2e-csi-fork-of-fork.sh
      - name: diagnose
        if: failure()
        run: ci/e2e-csi-fork-of-fork.sh diagnose
      - name: clean up
        if: always()
        run: |
          kind delete cluster --name agentfs-fork-of-fork || true
          ci/git-http-server.sh stop "$RUNNER_TEMP/git-server"
