name: Docker Hub through mirror.gcr.io
description: >-
  Points the runner's Docker daemon, and with `buildx` a BuildKit builder, at
  mirror.gcr.io for Docker Hub pulls (ci/docker-hub-mirror.sh), so CI's anonymous
  pulls stay clear of Docker Hub's rate limit. Run it after checkout and before any
  docker command in the job.
inputs:
  buildx:
    description: >-
      Also set up a buildx builder (docker/setup-buildx-action) whose BuildKit pulls
      Docker Hub through the mirror: its docker-container driver resolves images
      itself, not through the daemon.
    default: "false"
runs:
  using: composite
  steps:
    - shell: bash
      run: ci/docker-hub-mirror.sh daemon
    - if: inputs.buildx == 'true'
      shell: bash
      run: ci/docker-hub-mirror.sh buildkitd "$RUNNER_TEMP/buildkitd.toml"
    - if: inputs.buildx == 'true'
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        buildkitd-config: ${{ runner.temp }}/buildkitd.toml
