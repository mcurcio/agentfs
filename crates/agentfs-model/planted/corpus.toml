# The planted-bug corpus (VERIFYING.md, "Planting bugs"; run by planted/run.py).
# Each bug is one exact find-and-replace in a copy of crates/agentfs-model/src/**.
# `find` must match exactly once across that tree: an edit that moves code verbatim needs
# no change here, and an edit that really changes an anchor reports STALE until this file
# is re-anchored in the same commit. `seeds` is 64 (CI's seeds and scenarios) or 500.
# Keep `find` a single statement or arm where you can, so a nearby edit does not stale it.
# Anchors match exactly, leading whitespace included: a move that changes indentation
# makes them STALE.
#
# Not in the corpus, because no model behaviour can show them: finding 11's fix reverted
# (two renames to one path) reaches only the model's "not modelled" guard in no_clash,
# and P3 reintroduced (a write-open waiting behind a waiting take) has no form in a model
# whose calls never wait; R9.2's scenarios and the random runs' oracle_no_call_waits
# check that no call waits.

