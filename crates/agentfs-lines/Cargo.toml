[package]
name = "agentfs-lines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Line maps for agentfs's tree landing: which version wrote each line of a file, never the line's bytes"

[package.metadata.agentfs]
rank = "line-identity"

[dependencies]
# Git's histogram diff, called one way; its `Hunk` is in this crate's signatures.
agentfs-align = { version = "0.1.0", path = "../agentfs-align" }
# A line map's stored form is JSON.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[features]
# The line maps' I/O: a file read as an image (`FileImage`) and the diff's
# calls that take a spawner for their `git` child (`align_bytes_with`,
# `histogram_with`, `histogram_files_with`). The landing rules
# (agentfs-referee) build without it, so they reach no file or process
# through this crate (ci/check-deps.sh).
default = ["io"]
io = []
