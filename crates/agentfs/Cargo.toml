[package]
name = "agentfs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "agentfs command-line tool and daemon"

[dependencies]
agentfs-core = { version = "0.1.0", path = "../agentfs-core" }
agentfs-fuse = { version = "0.1.0", path = "../agentfs-fuse" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
signal-hook = "0.4.5"
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "logs"] }
# OTLP over http/protobuf, http/json (a blocking client) and gRPC (tonic):
# pure Rust, no protoc, no C (design §13, §17.3).
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "http-json", "grpc-tonic", "reqwest-blocking-client", "trace", "metrics", "logs"] }
# The runtime the gRPC exporter runs on (one worker, started only for gRPC).
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "time"] }
# TLS to the collector (the `otlp-tls` feature): rustls on ring, for the
# HTTP exporters through reqwest and for gRPC through tonic. Pure Rust plus
# ring's C and assembly; no OpenSSL, no aws-lc.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
rustls-pki-types = { version = "1.15", features = ["std"], optional = true }
tonic = { version = "0.14", default-features = false, features = ["tls-ring", "tls-native-roots"], optional = true }
# The restore thread's id (`thread`), and signals in tests (`process`).
rustix = { version = "1.1.5", features = ["fs", "process", "thread"] }
# close(2) and its errno in the FUSE tests (a front failing a boundary with
# EIO, design §14).
libc = "0.2.190"
# The control socket's JSON-lines protocol.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
# Drives a real `agentfs serve-history` through the CSI supervisor
# (csi_service.rs).
agentfs-csi = { version = "0.1.0", path = "../agentfs-csi" }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "net"] }
# Decodes OTLP payloads in the fake collector of the telemetry test.
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic", "with-serde", "trace", "metrics", "logs"] }
# The fake gRPC collector.
tonic = { version = "0.14", default-features = false, features = ["server", "router"] }
prost = "0.14"
git2 = { version = "0.21.0", default-features = false }
tempfile = "3.27.0"

[features]
# Push to https:// remotes (links OpenSSL).
https = ["agentfs-core/https"]
# Push to ssh:// and scp-like remotes (libssh2, links OpenSSL).
ssh = ["agentfs-core/ssh"]
# OTLP export to https:// collectors, with a CA bundle and client
# certificates (rustls on ring).
otlp-tls = ["dep:reqwest", "dep:rustls", "dep:rustls-native-certs", "dep:rustls-pki-types", "dep:tonic", "opentelemetry-otlp/tls-ring"]
# Test builds only: failpoints on the durable path (design §18 test 3),
# set by AGENTFS_FAILPOINTS. `--version` says `+failpoints`. Never in a
# release or image.
failpoints = ["agentfs-core/failpoints", "agentfs-fuse/failpoints"]
