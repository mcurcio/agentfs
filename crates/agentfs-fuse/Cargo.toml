[package]
name = "agentfs-fuse"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The agentfs FUSE layer: a recording passthrough filesystem over a backing tree"

[dependencies]
agentfs-contracts = { version = "0.1.0", path = "../agentfs-contracts" }
agentfs-core = { version = "0.1.0", path = "../agentfs-core" }
# Default features only: pure Rust (mount(2) as root, fusermount3
# otherwise), no libfuse or pkg-config needed to build.
fuser = "0.18.0"
libc = "0.2.190"
rustix = { version = "1.1.5", features = ["fs", "process", "mount", "thread", "time"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
git2 = { version = "0.21.0", default-features = false }
tempfile = "3.27.0"
# A fixed volume id in the tree view's tests.
uuid = { version = "1", default-features = false, features = ["std"] }

[features]
# Test builds only: agentfs-core's failpoints, and the FUSE layer's own.
# Never in a release or image.
failpoints = ["agentfs-core/failpoints"]
