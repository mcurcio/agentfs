[package]
name = "agentfs-fuse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The agentfs FUSE layer: a recording passthrough filesystem over a backing tree"

[package.metadata.agentfs]
rank = "filesystem"

[dependencies]
agentfs-contracts = { version = "0.1.0", path = "../agentfs-contracts" }
agentfs-core = { version = "0.1.0", path = "../agentfs-core" }
# The tree engine: the tree views' actor, sessions and rules (tree_view).
agentfs-engine = { version = "0.1.0", path = "../agentfs-engine" }
agentfs-failpoints = { version = "0.1.0", path = "../agentfs-failpoints" }
# Mounts (stale.rs, views.rs), and confined access (tree_view, backing.rs).
agentfs-os = { version = "0.1.0", path = "../agentfs-os" }
# The Rules domain: where a view's new names go (tree_view).
agentfs-rules = { version = "0.1.0", path = "../agentfs-rules" }
# Default features only: pure Rust (mount(2) as root, fusermount3
# otherwise), no libfuse or pkg-config needed to build.
fuser = "0.18.0"
libc = "0.2.190"
rustix = { version = "1.1.5", features = ["fs", "process", "mount", "thread", "time"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
# The engine's test-only surface: the tree view's tests create their volume.
agentfs-engine = { version = "0.1.0", path = "../agentfs-engine", features = ["test-util"] }
git2 = { version = "0.21.0", default-features = false }
tempfile = "3.27.0"
# A fixed volume id in the tree view's tests.
uuid = { version = "1", default-features = false, features = ["std"] }

[features]
# Test builds only: both engines' failpoints, and the FUSE layer's own.
# Never in a release or image.
failpoints = ["agentfs-core/failpoints", "agentfs-engine/failpoints", "agentfs-failpoints/failpoints"]
