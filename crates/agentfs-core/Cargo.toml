[package]
name = "agentfs-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Recording, journal and history engine for agentfs"

[dependencies]
crc32fast = "1.5.2"
git2 = { version = "0.21.0", default-features = false }
libgit2-sys = { version = "0.18.8", default-features = false }
rustix = { version = "1.1.5", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
