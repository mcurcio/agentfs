[package]
name = "agentfs-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Recording, journal and history engine for agentfs"

[dependencies]
# known_hosts key blobs and hashed host names, and OpenSSH private key
# headers (design §11.1).
base64 = "0.23.1"
bstr = "1.13.1"
crc32fast = "1.5.2"
git2 = { version = "0.21.0", default-features = false }
gix-attributes = "0.37.0"
gix-ignore = "0.24.0"
# Only for its `parallel` feature, which backs gix-attributes' names with
# `Arc` instead of `Rc`, so the rules engine is `Send + Sync`.
gix-parallel = { version = "0.50.0", features = ["parallel"] }
libgit2-sys = { version = "0.18.8", default-features = false }
# The API only: the binary picks the SDK and exporters (design §13).
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "logs"] }
# SO_PEERCRED and recv(MSG_PEEK) on local sockets (design §14, §15):
# bindings only, no C build.
libc = "0.2.190"
rustix = { version = "1.1.5", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# SHA-1 for the HMAC-SHA1 of hashed known_hosts entries; pure Rust, no
# dependencies.
sha1_smol = "1"
# SHA-256 object ids of Git LFS content (design §7); pure Rust.
sha2 = "0.11"
# The Git LFS batch API client (design §7): synchronous and pure Rust, with no
# TLS unless the `https` feature adds native-tls (OpenSSL, as libgit2 uses).
ureq = { version = "3.4", default-features = false }
thiserror = "2.0.21"
# The SSH transport (`ssh` feature, design §11.1): russh with ring, the
# runtime that drives one connection.
russh = { version = "0.64", default-features = false, features = ["ring", "rsa"], optional = true }
tokio = { version = "1.53", default-features = false, features = ["rt", "net", "time", "io-util"], optional = true }
# The history service's TLS transport between nodes (`history-tls`, design
# §14.1): rustls on ring, TLS 1.3 only, and rcgen for the volume's
# self-signed certificate. No OpenSSL, no aws-lc.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
rustls-pki-types = { version = "1.15", features = ["std"], optional = true }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"], optional = true }

[dev-dependencies]
# In-memory exporters for the telemetry tests.
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["testing"] }
tempfile = "3.27.0"
# The in-process ssh-agent of the transport tests (`ssh` feature): its
# connection stream.
futures = { version = "0.3.34", default-features = false, features = ["std"] }
# The in-process SSH server of the transport tests (`ssh` feature).
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "net", "process", "io-util", "time", "macros"] }

[features]
# Push to https:// remotes and https LFS endpoints: libgit2 and ureq with TLS
# (both link OpenSSL and use the system trust store). Local,
# file:// and plain http:// remotes need no feature.
https = ["git2/https", "ureq/native-tls"]
# Push to ssh:// and scp-like remotes through agentfs's own libgit2
# subtransport on russh (ring for crypto; no OpenSSL or libssh2). Without
# it an ssh remote is reported as misconfigured (design §11.1).
ssh = ["dep:russh", "dep:tokio"]
# Fronts on other nodes reach the history service over TLS 1.3, both ends
# pinned to the volume's own certificate (design §14.1). Without it, only
# the Unix socket on the service's node.
history-tls = ["dep:rustls", "dep:rustls-pki-types", "dep:rcgen"]
# Test builds only: failpoints on the durable path (design §18 test 3,
# `failpoints`). Never in a release or image.
failpoints = []

# The synchronous step's cost (design §3.2, §18 test 13): a plain binary,
# no harness or new dependencies; docs/performance.md describes it.
[[bench]]
name = "record_step"
harness = false
