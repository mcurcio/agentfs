# The e2e-csi driver overlay (ci/k8s-csi/driver) with a `hermes` profile
# for ci/e2e-hermes-kind.sh csi: the Hermes rule files
# (deploy/examples/hermes) and hermes.config, Hermes' operator settings
# with a remote and a patch source, both logged as not built. Build with
# --load-restrictor LoadRestrictionsNone.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../k8s-csi/driver

configMapGenerator:
  - name: agentfs-csi-profiles
    namespace: agentfs-csi
    behavior: merge
    options:
      disableNameSuffixHash: true
    files:
      - hermes.config
      - hermes.exclude=../../../../deploy/examples/hermes/exclude
      - hermes.attributes=../../../../deploy/examples/hermes/attributes
