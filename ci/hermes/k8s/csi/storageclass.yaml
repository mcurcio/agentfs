# The Hermes class: the `hermes` profile (ci/hermes/k8s/csi-driver), and
# the volume kept on its node when the claim is deleted (the only
# onDelete built).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: agentfs-hermes
provisioner: agentfs.mcurcio.github.io
parameters:
  profile: hermes
  onDelete: retain
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false
