apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes
spec:
  storageClassName: agentfs-hermes
  accessModes: [ReadWriteOncePod]
  resources:
    requests:
      storage: 1Gi
---
# HostToContainer: a replaced front reaches both containers live (csi.md
# §6).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app.kubernetes.io/name: hermes }
  template:
    metadata:
      labels: { app.kubernetes.io/name: hermes }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: hermes-config
          volumeMounts:
            - { name: data, mountPath: /opt/data, mountPropagation: HostToContainer }
        - name: dind
          volumeMounts:
            - { name: data, mountPath: /opt/data, mountPropagation: HostToContainer }
      containers:
        - name: hermes
          volumeMounts:
            - { name: data, mountPath: /opt/data, mountPropagation: HostToContainer }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes
