# Hermes in the sidecar pod of docs/deployment.md (ci/e2e-hermes-kind.sh
# sidecar), on the tree engine: the CI overlay of deploy/sidecar, with the
# Hermes settings and rule files (deploy/examples/hermes) as the
# ConfigMap's config, exclude and attributes (its remote and patch source
# are logged as not built), AGENTFS_VOLUME=hermes, and Hermes and
# docker-in-docker with the mount at /opt/data through subPath. The
# Deployment starts at zero replicas: the test migrates the volume first.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agentfs-e2e

resources:
  - ../../../k8s/namespace.yaml
  - ../../../../deploy/sidecar

components:
  - ../common

images:
  - name: ghcr.io/mcurcio/agentfs
    newName: agentfs
    newTag: ci

configMapGenerator:
  - name: agentfs-config
    behavior: replace
    files:
      - config=../../../../deploy/examples/hermes/config
      - exclude=../../../../deploy/examples/hermes/exclude
      - attributes=../../../../deploy/examples/hermes/attributes

patches:
  - path: deployment-patch.yaml
