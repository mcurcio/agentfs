# The runner's git server (ci/git-http-server.sh), reached from pods through
# the kind network's gateway. No selector: ci/e2e-kind.sh writes the
# EndpointSlice with the gateway's address.
apiVersion: v1
kind: Service
metadata:
  name: git-server
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
