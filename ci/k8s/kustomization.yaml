# The CI overlay of deploy/sidecar for the e2e-kind job (ci/e2e-kind.sh):
# the image built by the job, a remote on the runner's git server, fast
# pushes, and two writers (root and uid 10000) instead of the workload.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agentfs-e2e

resources:
  - namespace.yaml
  - git-server.yaml
  - ../../deploy/sidecar

images:
  - name: ghcr.io/mcurcio/agentfs
    newName: agentfs
    newTag: ci

configMapGenerator:
  - name: agentfs-config
    behavior: replace
    files:
      - config/config
      - config/exclude
      - config/attributes

patches:
  - path: deployment-patch.yaml
  - path: secret-patch.yaml
