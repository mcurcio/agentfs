# The e2e-csi-forks workloads (ci/e2e-csi-forks.sh): a source claim of the
# `cifork` profile with a pod writing to it, and the fork class sandboxes
# clone it with. The sandbox (sandbox.yaml) is applied by the script.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - storageclasses.yaml
  - source.yaml
