# The source's class, and the fork class (as deploy/csi/example's
# agentfs-fork, with its landing written out).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: agentfs-ci-source
provisioner: agentfs.mcurcio.github.io
parameters:
  profile: cifork
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: agentfs-ci-fork
provisioner: agentfs.mcurcio.github.io
parameters:
  fork: "true"
  landing: automatic
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false
