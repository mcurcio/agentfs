# The CI overlay for the e2e-csi-forks job (ci/e2e-csi-forks.sh): the
# e2e-csi driver overlay, a `cifork` profile with a separate fork remote,
# and a provisioner that retries DeleteVolume within 20 seconds.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../driver

configMapGenerator:
  - name: agentfs-csi-profiles
    namespace: agentfs-csi
    behavior: merge
    options:
      disableNameSuffixHash: true
    files:
      - profiles/cifork.config

patches:
  # csi-provisioner, the node plugin's second container.
  - target:
      kind: DaemonSet
      name: agentfs-csi-node
    patch: |-
      - op: test
        path: /spec/template/spec/containers/1/name
        value: csi-provisioner
      - op: add
        path: /spec/template/spec/containers/1/args/-
        value: --retry-interval-max=20s
