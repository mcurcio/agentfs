# The multi-node e2e's workloads (ci/e2e-csi-multinode.sh): a ReadWriteMany
# claim used by two writers on two nodes (required anti-affinity), each
# logging every successful close to a ledger in its own emptyDir. Step (h)
# applies rwo.yaml separately.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - storageclass.yaml
  - claims.yaml
  - writers.yaml

images:
  - name: ghcr.io/mcurcio/agentfs
    newName: agentfs
    newTag: ci
