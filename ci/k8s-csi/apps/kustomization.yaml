# The e2e-csi workload (ci/e2e-csi.sh): one restricted writer on a RWO
# claim of the `ci` profile. second.yaml, a second pod on the claim, is
# applied only by the refusal step.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - storageclass.yaml
  - pvc.yaml
  - writer.yaml

images:
  - name: ghcr.io/mcurcio/agentfs
    newName: agentfs
    newTag: ci
