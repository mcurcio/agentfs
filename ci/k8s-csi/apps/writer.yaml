# The one writer of the claim: restricted, uid 10000 with primary group
# 3000, and fsGroup 3001, so it creates at the volume's root only through
# its supplementary group. HostToContainer: the view a restarted host
# mounts at the kubelet's target reaches it live.
apiVersion: v1
kind: Pod
metadata:
  name: writer
  namespace: agentfs-csi-e2e-apps
spec:
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 5
  securityContext:
    runAsNonRoot: true
    runAsUser: 10000
    runAsGroup: 3000
    fsGroup: 3001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: writer
      image: ghcr.io/mcurcio/agentfs
      imagePullPolicy: IfNotPresent
      command: [sh, -c, "trap 'exit 0' TERM; while :; do sleep 1; done"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: [ALL] }
      volumeMounts:
        - { name: shared, mountPath: /data, mountPropagation: HostToContainer }
  volumes:
    - name: shared
      persistentVolumeClaim: { claimName: shared }
