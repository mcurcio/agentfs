# The e2e-csi class: the `ci` profile, and the claim's volume kept on its
# node when the claim is deleted (the only onDelete built).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: agentfs-ci
provisioner: agentfs.mcurcio.github.io
parameters:
  profile: ci
  onDelete: retain
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false
