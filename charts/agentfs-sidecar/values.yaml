# Defaults of the agentfs sidecar helpers (docs/helm.md). A workload
# chart depends on this library under an alias (`alias: agentfs`) and
# sets these under that key; each helper takes
# that values map, e.g. `include "agentfs-sidecar.initContainers"
# .Values.agentfs`.

image:
  # -- The agentfs image.
  repository: ghcr.io/mcurcio/agentfs
  # -- Its tag: required unless `digest` is set. Pin a commit tag
  # (`<40-char sha>`); `latest` follows main.
  tag: ""
  # -- A digest (`sha256:...`); when set, it pins the image.
  digest: ""
  # -- The pull policy; empty leaves the Kubernetes default.
  pullPolicy: ""

# -- The agentfs volume name (required): a label and a guard, kept in
# the volume's identity file and every commit's `Agentfs-Volume` trailer.
volume: ""

# -- `UID:GID` a new volume's root directory is recorded with
# (`AGENTFS_OWNER`), so a non-root workload can write at the top of the
# volume; empty leaves it the init container's (root). Applies only when
# the volume is created.
owner: ""

# -- Labels of the ConfigMap, Secret and claim the helpers render.
labels: {}

config:
  # -- The ConfigMap the helpers render and mount.
  name: agentfs-config
  # -- Operator settings, included from the volume's operator settings
  # file (git-config syntax; every key is in docs/configuration.md). A key
  # tree volumes do not build yet (remotes, patches, LFS) is logged at
  # every boot and counted by the `agentfs.not_built` gauge.
  settings: ""
  # -- Mounted over `<state>/history.git/info/exclude`: new paths never
  # recorded.
  exclude: ""
  # -- Mounted over `<state>/history.git/info/attributes`: `-agentfs`
  # marks paths never recorded.
  attributes: ""

credentials:
  # -- The Secret mounted at `/run/secrets/agentfs` in the sidecar, for
  # the remotes' credentials once push is built. Create it out of band, or
  # set `stringData` for the helpers to render it.
  secretName: agentfs-credentials
  # -- Keys of a Secret for `agentfs-sidecar.secret` to render. Prefer an
  # out-of-band Secret: values end up in the release record.
  stringData: {}

claim:
  # -- The claim holding the volume's state area, mounted at `/data` in
  # the agentfs containers only.
  name: agentfs-data
  # -- Its access modes. ReadWriteOncePod makes this pod the single writer.
  accessModes: [ReadWriteOncePod]
  # -- Its size.
  size: 10Gi
  # -- Its StorageClass; empty means the cluster default.
  storageClassName: ""

# -- What the sidecar does on a stale mount after a crash: `recover`
# stacks over it, `hold` waits for a pod restart.
onStaleMount: recover

# -- Seal the bare mount point (root's, mode 0000) so a non-root workload
# cannot write where nothing records it.
sealMountpoint: true

# -- More environment of the sidecar: OpenTelemetry (docs/telemetry.md),
# which carries the `agentfs.not_built` gauge to your collector.
env:
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: http://otel-collector.observability.svc:4318
  - name: OTEL_SERVICE_NAME
    value: agentfs
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: k8s.container.name=agentfs
  - name: OTEL_TRACES_SAMPLER
    value: parentbased_traceidratio
  - name: OTEL_TRACES_SAMPLER_ARG
    value: "0.01"

# -- The sidecar's resources. An OOM kill is a crash: size the limit for
# the volume.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 512Mi
