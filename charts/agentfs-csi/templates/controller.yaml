# The controller: csi-provisioner and csi-attacher in front of
# `agentfs-csi --mode controller` (design §14.2, docs/csi.md "Architecture").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentfs-csi-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentfs-csi-controller
    {{- include "agentfs-csi.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agentfs-csi-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentfs-csi-controller
      {{- with .Values.controller.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: agentfs-csi-controller
      # Only the two sidecars talk to the API server: the token is mounted
      # into them alone (the `api-token` volume), never into agentfs-csi.
      automountServiceAccountToken: false
      {{- with .Values.controller.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: csi-provisioner
          {{- include "agentfs-csi.sidecarImage" .Values.sidecars.provisioner | nindent 10 }}
          args:
            - --csi-address=/csi/csi.sock
            # PVC name and namespace for the volume name and branch.
            - --extra-create-metadata
            - --leader-election
            - --leader-election-namespace={{ .Release.Namespace }}
            # A fork's CreateVolume copies its source's history locally.
            - --timeout=120s
            {{- with .Values.sidecars.provisioner.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- include "agentfs-csi.sidecarSecurityContext" . | nindent 10 }}
          {{- with .Values.sidecars.provisioner.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - { name: socket-dir, mountPath: /csi }
            - { name: api-token, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true }
        - name: csi-attacher
          {{- include "agentfs-csi.sidecarImage" .Values.sidecars.attacher | nindent 10 }}
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election
            - --leader-election-namespace={{ .Release.Namespace }}
            - --timeout=60s
            {{- with .Values.sidecars.attacher.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- include "agentfs-csi.sidecarSecurityContext" . | nindent 10 }}
          {{- with .Values.sidecars.attacher.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - { name: socket-dir, mountPath: /csi }
            - { name: api-token, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true }
        - name: liveness-probe
          {{- include "agentfs-csi.sidecarImage" .Values.sidecars.livenessProbe | nindent 10 }}
          args: [--csi-address=/csi/csi.sock, --http-endpoint=:9808]
          {{- include "agentfs-csi.sidecarSecurityContext" . | nindent 10 }}
          {{- with .Values.sidecars.livenessProbe.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - { name: socket-dir, mountPath: /csi }
        - name: agentfs-csi
          {{- include "agentfs-csi.agentfsImage" . | nindent 10 }}
          command: [agentfs-csi]
          args:
            - --mode=controller
            - --endpoint=unix:///csi/csi.sock
            - --base-path={{ .Values.basePath.path }}
            - --profiles-dir=/etc/agentfs-csi/profiles
            {{- with .Values.controller.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - { name: healthz, containerPort: 9808 }
          livenessProbe:
            httpGet: { path: /healthz, port: healthz }
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          # Root, because the volume directories are root's; DAC_OVERRIDE and
          # FOWNER only so that DeleteVolume can remove the workloads' files.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [DAC_OVERRIDE, FOWNER]
            readOnlyRootFilesystem: true
            seccompProfile: { type: RuntimeDefault }
          {{- with .Values.controller.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - { name: socket-dir, mountPath: /csi }
            - { name: base, mountPath: {{ .Values.basePath.path }} }
            - { name: profiles, mountPath: /etc/agentfs-csi/profiles, readOnly: true }
      volumes:
        - name: socket-dir
          emptyDir: {}
        {{- include "agentfs-csi.baseVolume" . | nindent 8 }}
        - name: profiles
          configMap: { name: agentfs-csi-profiles }
        {{- include "agentfs-csi.apiTokenVolume" . | nindent 8 }}
