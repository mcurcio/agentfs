{{- /*
StorageClasses of the driver. `parameters` go to the driver as written
(docs/configuration.md "The CSI driver"): every setting of a volume is the
operator's, and pod authors only choose the class.
*/}}
{{- range .Values.storageClasses }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .name }}
  labels:
    {{- include "agentfs-csi.labels" $ | nindent 4 }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
provisioner: {{ include "agentfs-csi.driverName" $ }}
{{- with .parameters }}
parameters:
  {{- toYaml . | nindent 2 }}
{{- end }}
# Always Delete (the class admission policy refuses any other):
# DeleteVolume decides what a released worktree needs.
reclaimPolicy: {{ .reclaimPolicy | default "Delete" }}
volumeBindingMode: {{ .volumeBindingMode | default "WaitForFirstConsumer" }}
allowVolumeExpansion: false
{{- end }}
