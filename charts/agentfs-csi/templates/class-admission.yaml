{{- if .Values.classAdmission.enabled }}
# Every StorageClass of the driver must have reclaim policy Delete (docs/csi.md): DeleteVolume then always runs: it keeps a
# claim's volume on its node and ends a fork claim's fork. With Retain, a
# fork would never end, and a claim's PV would stay Released for ever.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: agentfs-class
  labels:
    {{- include "agentfs-csi.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["storage.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["storageclasses"]
  matchConditions:
    - name: an-agentfs-class
      expression: object.provisioner == '{{ include "agentfs-csi.driverName" . }}'
  validations:
    - expression: "!has(object.reclaimPolicy) || object.reclaimPolicy == 'Delete'"
      message: >-
        an agentfs StorageClass must have reclaimPolicy Delete: DeleteVolume
        must run so the driver can release the volume (a claim's volume is
        kept on its node, a fork claim's fork is ended) (docs/csi.md)
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: agentfs-class
  labels:
    {{- include "agentfs-csi.labels" . | nindent 4 }}
spec:
  policyName: agentfs-class
  validationActions: [Deny]
{{- end }}
