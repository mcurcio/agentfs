{{- if not .Values.credentials.existingSecret }}
# Remote credentials for every profile, mounted read-only into the node
# plugin at /etc/agentfs-csi/credentials (docs/csi.md §4). Prefer credentials.existingSecret,
# created out of band.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentfs-csi.credentialsSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentfs-csi.labels" . | nindent 4 }}
type: Opaque
{{- with .Values.credentials.stringData }}
stringData:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
