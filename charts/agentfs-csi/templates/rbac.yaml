# The driver's whole RBAC inventory (design §14.2, docs/csi.md
# "Security"). No rule grants secrets, pods or snapshots. The node
# plugin's account is used by csi-provisioner (`--node-deployment`) alone:
# its token is projected into that sidecar only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentfs-csi-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentfs-csi.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentfs-csi-provisioner
  labels:
    {{- include "agentfs-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, update]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [list, watch, create, update, patch]
  - apiGroups: [storage.k8s.io]
    resources: [csinodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentfs-csi-provisioner
  labels:
    {{- include "agentfs-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: agentfs-csi-node
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: agentfs-csi-provisioner
  apiGroup: rbac.authorization.k8s.io
