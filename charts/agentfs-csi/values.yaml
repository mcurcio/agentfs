# The agentfs CSI driver (design §14.2, docs/csi.md, docs/helm.md).
# Install into a namespace labelled for privileged pods (docs/helm.md).

image:
  # -- The agentfs image: `agentfs-csi` and the `agentfs` it starts.
  repository: ghcr.io/mcurcio/agentfs
  # -- Its tag; empty means the chart's appVersion (a published chart's
  # commit id).
  tag: ""
  # -- A digest (`sha256:...`); when set, it pins the image.
  digest: ""
  # -- The pull policy; empty leaves the Kubernetes default.
  pullPolicy: ""

# -- Pull secrets for every image, as `[{name: ...}]`.
imagePullSecrets: []

# The Kubernetes CSI sidecars, pinned by digest (the tag is informational).
sidecars:
  provisioner:
    image:
      # -- csi-provisioner's image: in the node plugin pod of every node
      # (`--node-deployment`), provisioning that node's worktrees.
      repository: registry.k8s.io/sig-storage/csi-provisioner
      # -- csi-provisioner's tag.
      tag: v6.4.0
      # -- csi-provisioner's digest.
      digest: sha256:6ebe60fd8ed67a7f8a90d34402e9e706b274e53612d6fa5fbb8285728db622e2
    # -- More csi-provisioner flags, e.g. `--retry-interval-max=20s`.
    extraArgs: []
    # -- csi-provisioner's resources.
    resources: {}
  nodeDriverRegistrar:
    image:
      # -- node-driver-registrar's image.
      repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
      # -- node-driver-registrar's tag.
      tag: v2.18.0
      # -- node-driver-registrar's digest.
      digest: sha256:b7fefd08651f00ac4df1a196ed4c621c2451fbb899297fe9fad9e36c667af0c0
    # -- node-driver-registrar's resources.
    resources: {}
  livenessProbe:
    image:
      # -- livenessprobe's image.
      repository: registry.k8s.io/sig-storage/livenessprobe
      # -- livenessprobe's tag.
      tag: v2.20.0
      # -- livenessprobe's digest.
      digest: sha256:19f2cf2f40e1987c7943945deca5f65cd4e4bf5cc0657fc78a5df131861578e8
    # -- livenessprobe's resources.
    resources: {}

# -- The kubelet's directory on the nodes. Some distributions move it
# (k0s: `/var/lib/k0s/kubelet`).
kubeletDir: /var/lib/kubelet

basePath:
  # -- Where each node keeps its worktrees (`--base-path`): a hostPath
  # directory on the node's own disk, ideally a disk of its own, since a
  # full disk makes the kubelet evict every pod on the node. A network
  # filesystem is refused (docs/csi.md §11).
  path: /var/lib/agentfs-csi/volumes

node:
  # -- The node plugin's priority class.
  priorityClassName: system-node-critical
  # -- Longer than `--unpublish-grace` plus `--unstage-grace`, so a
  # stopped plugin lets its children make their final commits.
  terminationGracePeriodSeconds: 60
  # -- Where the node keeps its staged and published records
  # (`--node-state`); must survive plugin restarts.
  stateDir: /var/lib/agentfs-csi/node
  # -- More `agentfs-csi` flags (docs/configuration.md), e.g.
  # `--release-scan-interval=10s`.
  extraArgs: []
  # -- Environment of the node plugin, inherited by every history service
  # and front: the `OTEL_*` variables (docs/telemetry.md). Point
  # `OTEL_EXPORTER_OTLP_ENDPOINT` at your collector to turn telemetry on.
  env:
    - name: OTEL_SDK_DISABLED
      value: "true"
  # -- The agentfs-csi container's resources. Every history service and
  # front on the node runs in this container, inside these limits.
  resources: {}
  # -- Annotations on the node plugin's pods.
  podAnnotations: {}
  # -- The node plugin's node selector.
  nodeSelector: {}
  # -- The node plugin runs on every node by default.
  tolerations:
    - operator: Exists
  # -- The node plugin's affinity.
  affinity: {}

# -- Profiles: every setting of a volume, by name (docs/csi.md
# "Profiles and credentials"). Each is `{config, exclude, attributes}`:
# the git-config fragment and the optional rule files. A StorageClass
# picks one with the parameter `profile: <name>`. Load files with
# `--set-file profiles.<name>.config=<path>`.
profiles: {}

credentials:
  # -- Use this existing Secret for remote credentials instead of the
  # chart's; create it out of band (`kubectl create secret generic`).
  existingSecret: ""
  # -- Keys of the chart's own Secret, mounted at
  # `/etc/agentfs-csi/credentials/<key>`. Prefer `existingSecret`: values
  # end up in the release record.
  stringData: {}

classAdmission:
  # -- Install the ValidatingAdmissionPolicy `agentfs-class`, which refuses
  # any StorageClass of the driver whose reclaim policy is not Delete, so
  # DeleteVolume always runs and the release decider always answers
  # (docs/csi.md §5). Off: a class with Retain loses nothing, but its PVs
  # stay Released for ever.
  enabled: true

alerts:
  # -- Install the example alert rules of deploy/alerts as a Prometheus
  # Operator PrometheusRule (docs/deployment.md "Alerts"). Needs its CRD.
  enabled: false
  # -- More labels on the PrometheusRule, for your Prometheus's
  # ruleSelector (kube-prometheus-stack selects `release: <its release>`).
  labels: {}

# The chart's minimal git server (docs/helm.md "The git server"): one pod
# serving /git/history.git at
# http://agentfs-git-server.<namespace>.svc:<server.service.port>, for
# profiles to push to. A git remote, not a forge.
server:
  # -- Run the chart's minimal git server (smart HTTP, basic auth). Off by default.
  enabled: false
  image:
    # -- The server's image (examples/docker/git-server).
    repository: ghcr.io/mcurcio/agentfs-git-server
    # -- Empty: the chart's appVersion.
    tag: ""
    # -- A digest (`sha256:...`); when set, it pins the image.
    digest: ""
    # -- The pull policy; empty leaves the Kubernetes default.
    pullPolicy: ""
  storage:
    # -- StorageClass of the server's claim (any: NFS 4.0, iSCSI, local). Empty: the cluster default.
    storageClassName: ""
    # -- The claim's size. Fixed at install: a StatefulSet's claim template
    # cannot change.
    size: 10Gi
    # -- The claim's access modes; one pod uses it.
    accessModes: [ReadWriteOnce]
  credentials:
    # -- An existing Secret with keys `htpasswd` (read by the server) and `token`
    # (an agentfs credentials file, `username=` and `password=` lines,
    # mounted for profiles at /etc/agentfs-csi/credentials/agentfs-server).
    # Empty: the chart makes one with a random password, kept across upgrades (lookup).
    existingSecret: ""
  service:
    # -- The Service's port.
    port: 8080
  # -- The server container's resources.
  resources: {}
  # -- The server's node selector.
  nodeSelector: {}
  # -- The server's tolerations.
  tolerations: []
  # -- The server's affinity.
  affinity: {}
  # -- Annotations on the server's pod.
  podAnnotations: {}

# -- StorageClasses of the driver: `[{name, parameters, reclaimPolicy,
# volumeBindingMode, annotations}]`. `parameters` go to the driver as
# written (docs/configuration.md "The CSI driver"). `reclaimPolicy`
# defaults to Delete (the class admission policy refuses any other; a
# worktree is kept by `onDelete: retain`, the default); `volumeBindingMode`
# to WaitForFirstConsumer, which picks the node first.
storageClasses: []
